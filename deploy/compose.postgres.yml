# Dedicated installer database. The development Compose file stays independent.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pga
      POSTGRES_DB: pga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing installer database password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pga -d pga"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  postgres-data:
