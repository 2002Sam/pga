<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PGA 工作台</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* the same monochrome line-art language as the sky: black, white lines, one warm accent for "working" */
:root {
  --bg: #050505; --panel: #0a0a0a; --text: #e8e8e8; --muted: #8a8a8a; --dim: #555;
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.2); --line-3: rgba(255,255,255,.42);
  --gold: #e9a94b; --gold-dim: rgba(233,169,75,.35); --bad: #f08a7a;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --cap: 400 10px var(--mono);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.6 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line-2); background: transparent; padding: 4px 10px; white-space: nowrap; transition: border-color .15s, color .15s, background .15s; }
button:hover { border-color: var(--line-3); }
button.primary { border-color: var(--gold); color: var(--gold); }
button.primary:hover { background: rgba(233,169,75,.1); }
button.ghost { border-color: transparent; color: var(--muted); padding: 2px 6px; }
button.ghost:hover { color: var(--text); border-color: var(--line-2); }
button:disabled { opacity: .4; cursor: default; }
a { color: inherit; }
.cap { font: var(--cap); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.mono { font-family: var(--mono); }

/* layout */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header { display: flex; align-items: center; gap: 18px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
header .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
header .logo img { width: 22px; height: 22px; }
header .logo b { font-weight: 500; letter-spacing: .35em; font-size: 13px; }
header nav { display: flex; gap: 2px; }
header nav a { text-decoration: none; padding: 4px 12px; border: 1px solid transparent; color: var(--muted); }
header nav a.on { border-color: var(--line-2); color: var(--text); }
header nav a:hover { color: var(--text); }
header .pulse { margin-left: auto; display: flex; gap: 18px; align-items: center; color: var(--muted); font-size: 12px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); vertical-align: 1px; }
.dot.on { background: var(--gold); box-shadow: 0 0 0 0 var(--gold-dim); animation: beat 1.6s infinite; }
.dot.ok { background: #cfcfcf; } .dot.bad { background: var(--bad); }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(233,169,75,.55); } 70% { box-shadow: 0 0 0 7px rgba(233,169,75,0); } 100% { box-shadow: 0 0 0 0 rgba(233,169,75,0); } }

.stage { position: relative; min-height: 0; overflow: hidden; }
/* like talking to a planet in the dispatch constellation: the sky stays, the view glides to the body, the rest fades,
   and the workbench appears beside it with no frame — the small map and the list on the left, the words on the right */
main { position: absolute; inset: 0; display: grid; grid-template-columns: 300px 280px minmax(0, 1fr); min-height: 0; z-index: 2; background: transparent;
  pointer-events: none; transition: opacity .6s ease .35s; text-shadow: 0 0 8px rgba(3,5,8,.95), 0 0 2px rgba(3,5,8,.9), 0 0 18px rgba(3,5,8,.7); }
main > section { pointer-events: auto; }
body.sky main { opacity: 0; transition: opacity .25s ease; }
body.sky main > section { pointer-events: none; }
.planetzone { pointer-events: none; }
#sky { position: absolute; inset: 0; z-index: 1; background: #050505; }
#lead { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; overflow: visible; opacity: 0; transition: opacity .9s ease .5s; }
body:not(.sky) #lead { opacity: 1; }
#lead line { stroke: rgba(233,169,75,.5); stroke-width: 1; } #lead circle { fill: #e9a94b; opacity: .8; }
#sky iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.skyhint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 2; font-size: 12px; color: var(--muted); pointer-events: none;
  background: rgba(5,5,5,.55); padding: 4px 12px; letter-spacing: .04em; }
body:not(.sky) .skyhint { opacity: 0; }
.skytools { position: absolute; right: 14px; top: 12px; z-index: 2; display: flex; gap: 6px; }
.skytools button { background: rgba(5,5,5,.7); font-size: 12px; }
body:not(.sky) .skytools { display: none; }

main > section { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #222 transparent; }
#left { padding: 0; display: flex; flex-direction: column; overflow: hidden !important; background: linear-gradient(90deg, rgba(5,5,5,.7), rgba(5,5,5,.35) 80%, transparent); }
#center { background: linear-gradient(90deg, transparent, rgba(5,5,5,.55) 90px, rgba(5,5,5,.72)); padding-left: 60px !important; }
.mini { border-bottom: 0 !important; }
.aim, .ag { border-top-color: rgba(255,255,255,.06) !important; }
/* the small disc, like the dispatch constellation's: everything, flattened; click to move between bodies */
.mini { flex: none; border-bottom: 1px solid var(--line); padding: 10px 10px 6px; }
.mini .hh { display: flex; align-items: baseline; gap: 10px; padding: 0 6px 4px; }
.mini .hh .cap { flex: 1; color: rgba(233,169,75,.85); }
.mini svg { display: block; width: 100%; overflow: visible; }
.mini .orb { fill: none; stroke: rgba(220,232,238,.1); stroke-width: 1; }
.mini .ln { stroke: rgba(220,232,238,.13); stroke-width: 1; }
.mini .ln.lit { stroke: rgba(233,169,75,.8); }
.mini .nd { cursor: pointer; }
.mini .nd .body { fill: #07090b; stroke: rgba(220,232,238,.55); stroke-width: 1; }
.mini .nd.aim .body { fill: #000; stroke: rgba(220,232,238,.75); }
.mini .nd.aim .halo { fill: none; stroke: rgba(220,232,238,.18); stroke-width: 1; }
.mini .nd.you .body { fill: #eef1f2; stroke: none; }
.mini .nd.off { opacity: .4; }
.mini .nd .rem { fill: none; stroke: #e9a94b; stroke-width: 1.6; stroke-linecap: round; }
.mini .nd .cur { fill: none; stroke: #f3d38a; stroke-width: 1.2; }
.mini .nd .run { fill: none; stroke: #e9a94b; stroke-width: 1; opacity: 0; transform-box: fill-box; transform-origin: center; }
.mini .nd.running .run { animation: mapRipple 1.4s ease-out infinite; }
@keyframes mapRipple { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
.mini .nd text { font: 10px var(--font); fill: rgba(236,228,214,.72); text-anchor: middle; paint-order: stroke; stroke: rgba(3,5,8,.9); stroke-width: 3px; }
.mini .nd.is-cur text { fill: #fff3d6; }
.mini .nd:hover .body { stroke: #fff3d6; }
.mapnote-unused { position: absolute; left: 10px; top: 10px; right: 150px; z-index: 2; font-size: 11.5px; color: var(--muted); pointer-events: none; background: rgba(5,5,5,.6); padding: 3px 8px; justify-self: start; width: fit-content; max-width: calc(100% - 160px); }
.list { flex: 0 1 42%; overflow-y: auto; padding: 12px 0; scrollbar-width: thin; scrollbar-color: #222 transparent; }
#right { border-left: 1px solid var(--line); padding: 14px 0; }
#center { padding: 18px 26px 40px; }
.colh { display: flex; align-items: baseline; gap: 10px; padding: 0 16px 10px; }
.colh .cap { flex: 1; }

/* motivations → projects */
.aim { border-top: 1px solid var(--line); padding: 12px 16px 10px; cursor: pointer; }
.aim.sel { background: rgba(255,255,255,.035); box-shadow: inset 2px 0 0 var(--gold); }
.aim .t { font-size: 13.5px; line-height: 1.5; }
.aim .st { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.aim .q { color: var(--gold); font-size: 11.5px; margin-top: 4px; }
.bar { height: 2px; background: var(--line); position: relative; margin-top: 8px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); }
.bar.gold i { background: var(--gold); }
.projs { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.proj { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); font-size: 12.5px; }
.proj .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .n small { display: block; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.proj .run { min-width: 64px; }
.free .proj .run { color: var(--dim); }
.empty { color: var(--dim); font-size: 12px; padding: 4px 0; }

/* the process */
.ph { display: flex; gap: 16px; align-items: flex-start; }
.ph h1 { flex: 1; font-size: 20px; font-weight: 400; line-height: 1.45; margin: 0; }
.ph .ctl { display: flex; gap: 8px; flex-direction: column; align-items: flex-end; }
.bigrun { font-size: 14px; padding: 8px 18px; min-width: 120px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 12px 0 4px; font-size: 12.5px; color: var(--muted); }
.meta b { color: var(--text); font-weight: 400; }
.parts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 14px 0 6px; }
.parts .p .cap { letter-spacing: .1em; }
.parts .p.top .cap { color: var(--gold); }
h2 { font: var(--cap); letter-spacing: .22em; color: var(--muted); text-transform: uppercase; margin: 30px 0 10px; display: flex; gap: 10px; align-items: baseline; }
h2 small { letter-spacing: .04em; text-transform: none; color: var(--dim); font-size: 11px; }

.live { border: 1px solid var(--gold-dim); margin-bottom: 10px; }
.live .lh { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.live .lh .who { flex: 1; }
.live pre { margin: 0; padding: 10px 12px; max-height: 340px; overflow-y: auto; font: 12px/1.65 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: #d8d8d8; }
.live pre .tool { color: var(--muted); }
.live pre .cursor::after { content: "▍"; color: var(--gold); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }
.idle { border: 1px dashed var(--line-2); padding: 14px; color: var(--muted); font-size: 12.5px; }

.ask { border: 1px solid var(--line-2); padding: 12px; margin-bottom: 8px; }
.ask .qt { margin-bottom: 8px; }
.ask textarea { width: 100%; min-height: 54px; resize: vertical; background: transparent; border: 1px solid var(--line-2); padding: 6px 8px; outline: none; }
.ask textarea:focus { border-color: var(--line-3); }
.ask .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

.tl { position: relative; padding-left: 18px; }
.tl::before { content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 1px; background: var(--line-2); }
.ev { position: relative; padding: 8px 0 12px; }
.ev::before { content: ""; position: absolute; left: -18px; top: 15px; width: 9px; height: 9px; border: 1px solid var(--line-3); background: var(--bg); border-radius: 50%; }
.ev.run::before { background: var(--text); border-color: var(--text); }
.ev.q::before { border-color: var(--gold); }
.ev.user::before { background: var(--gold); border-color: var(--gold); }
.ev.bad::before { background: var(--bad); border-color: var(--bad); }
.ev .h { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--muted); }
.ev .h b { color: var(--text); font-weight: 500; }
.ev .h .k { font: var(--cap); letter-spacing: .14em; }
.ev .h time { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; }
.ev .b { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.65; }
.ev .b.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.ev .more { margin-top: 6px; }
.detail { margin-top: 10px; border-left: 1px solid var(--line-2); padding-left: 12px; }
.detail .cap { margin: 12px 0 4px; display: block; }
.detail pre { margin: 0; max-height: 380px; overflow: auto; font: 11.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: #cfcfcf; }
.detail details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 10px; }

/* how free it is */
.levels { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-2); margin: 16px 0 6px; }
.levels button { border: 0; border-right: 1px solid var(--line-2); text-align: left; padding: 9px 12px; white-space: normal; line-height: 1.45; }
.levels button:last-child { border-right: 0; }
.levels button b { display: block; font-weight: 500; font-size: 13px; }
.levels button span { color: var(--muted); font-size: 11.5px; }
.levels button.on { background: rgba(233,169,75,.08); box-shadow: inset 0 -2px 0 var(--gold); }
.levels button.on b { color: var(--gold); }
.lvlrow { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
.lvlrow input { width: 52px; background: transparent; border: 1px solid var(--line-2); padding: 1px 6px; }

/* checkpoint */
.cp { border: 1px solid var(--gold); padding: 14px 16px; margin: 6px 0 4px; }
.cp .cap { color: var(--gold); }
.cp p { margin: 6px 0 10px; white-space: pre-wrap; }
.cp .opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
.cp .opt small { display: block; color: var(--muted); }
.cp .prop { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 12.5px; }
.cp .prop .rec { color: var(--gold); font-size: 11px; }
.cp textarea, .talk textarea { width: 100%; min-height: 54px; resize: vertical; background: transparent; border: 1px solid var(--line-2); padding: 6px 8px; outline: none; margin-top: 8px; }
.cp .row, .talk .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; align-items: center; }

/* talk to it (user-driven work, and quick asks at any level) */
.talk { border: 1px solid var(--line-2); padding: 12px; }
.talk select { background: #0a0a0a; border: 1px solid var(--line-2); padding: 3px 6px; }
.talk .ans { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; border-left: 1px solid var(--line-3); padding-left: 10px; }
.talk .row .grow { flex: 1; color: var(--muted); font-size: 11.5px; }

/* a conversation (我, and each agent) */
.chat { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.7; }
.msg.me { color: rgba(232,232,232,.72); padding-left: 14px; position: relative; }
.msg.me::before { content: "›"; position: absolute; left: 0; color: var(--gold); }
.msg .who { display: block; font: var(--cap); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
.msg.err { color: var(--bad); }
.msg pre { margin: 6px 0 0; padding: 8px 10px; border: 1px solid var(--gold-dim); max-height: 260px; overflow: auto; font: 11.5px/1.6 var(--mono); white-space: pre-wrap; color: #cfcfcf; }
.msg pre .cursor::after { content: "▍"; color: var(--gold); animation: blink 1s infinite; }
.hist { display: flex; flex-direction: column; gap: 2px; }
.hist button { text-align: left; border: 0; border-left: 1px solid var(--line-2); padding: 4px 10px; white-space: normal; color: var(--muted); font-size: 12.5px; }
.hist button:hover { color: var(--text); border-left-color: var(--gold); }
.hist button small { color: var(--dim); margin-left: 6px; }
.selhead { display: flex; gap: 14px; align-items: baseline; }
.selhead h1 { flex: 1; font-size: 20px; font-weight: 400; margin: 0; line-height: 1.45; }
.selhead .k { font: var(--cap); letter-spacing: .2em; color: var(--muted); }
.ag { cursor: pointer; }
.ag.sel { background: rgba(255,255,255,.035); box-shadow: inset 2px 0 0 var(--gold); }

/* agents */
.ag { border-top: 1px solid var(--line); padding: 11px 16px 12px; }
.ag .h { display: flex; gap: 8px; align-items: center; }
.ag .h b { font-weight: 500; }
.ag .h .s { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.ag .r { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.ag .q { display: flex; gap: 8px; align-items: center; margin-top: 7px; font-size: 11px; color: var(--muted); }
.ag .q .bar { flex: 1; margin: 0; }
.ag .w { margin-top: 8px; border-left: 1px solid var(--gold); padding: 2px 0 2px 9px; font-size: 12px; }
.ag .w .tail { font: 11px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; max-height: 4.6em; overflow: hidden; margin-top: 3px; }
.ag .acts { display: flex; gap: 6px; margin-top: 8px; }
.ag.off { opacity: .5; }

#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; background: #111; border: 1px solid var(--line-2); padding: 8px 16px; font-size: 12.5px; pointer-events: none; z-index: 9; }
#toast.on { opacity: 1; transform: translateX(-50%); }

/* narrower windows: agents fold under the process */
@media (max-width: 1180px) { main { grid-template-columns: 260px 200px minmax(0, 1fr); } #right { grid-column: 2; border-left: 0; border-top: 1px solid var(--line); } main { grid-auto-rows: min-content; overflow-y: auto; } main > section { overflow: visible; } }
@media (max-width: 900px) { main { grid-template-columns: 1fr; background: rgba(5,5,5,.85); } .planetzone { display: none; } #center { padding-left: 16px !important; } #left { overflow: visible !important; } #left, #right { border: 0; border-top: 1px solid var(--line); } #right { grid-column: 1; } #center { padding: 16px; } .parts { grid-template-columns: repeat(2, 1fr); } header { flex-wrap: wrap; } }
</style>
</head>
<body class="sky">
<div class="app">
  <header>
    <a class="logo" href="/console"><img src="/icons/favicon-32.png?v=3" alt=""><b>PGA</b></a>
    <nav><a class="on" href="/console">工作台</a><a href="/?sky" id="toFull" title="原来的完整星空（带所有面板）">完整星空</a></nav>
    <div class="pulse"><span id="pWorking"><span class="dot"></span> —</span><span id="pTasks">—</span><span id="pUpdated" class="dim"></span></div>
  </header>
  <div class="stage">
  <div id="sky"><iframe id="map" title="星空"></iframe>
    <div class="skytools"><button id="toDesk" title="直接进工作台">工作台 →</button></div>
    <div class="skyhint" id="mapNote">点一颗星球、一个太阳系或「我」（地球）：进入它的工作台</div></div>
  <svg id="lead" aria-hidden="true"><line/><circle r="2.5"/></svg>
  <main>
    <section id="left">
      <div class="mini"><div class="hh"><span class="cap">星图</span><button class="ghost" id="toSky" title="回到星空（也可以按 Esc）">⟲ 星空</button></div><svg id="miniSvg"></svg></div>
      <div class="list"><div class="colh"><span class="cap">我 · 抱负 · 项目</span></div><div id="aims"></div></div>
    </section>
    <div class="planetzone"></div>
    <section id="center"><div id="proc"><div class="idle">正在载入…</div></div></section>
  </main>
  </div>
</div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const AS_UID = new URLSearchParams(location.search).get("as");
if (AS_UID) $("#toFull").href = `/?sky&as=${encodeURIComponent(AS_UID)}`;
const C = { uid: AS_UID || store.get("pga_uid"), data: null, sel: AS_UID ? null : store.get("pga_console_aim"), proc: null, live: [],
            open: new Set(), details: {}, drafts: {}, busy: new Set(), talk: { agent: store.get("pga_console_agent") || "claude", sending: false, last: null },
            cp: { option: 0, approve: null },
            view: { kind: "aim", id: null }, graph: null, chats: {}, hist: {}, mapReady: false };
try { C.chats = JSON.parse(store.get("pga_console_chats") || "{}") || {}; } catch { C.chats = {}; }
const saveChats = () => { if (!AS_UID) { try { store.set("pga_console_chats", JSON.stringify(Object.fromEntries(Object.entries(C.chats).map(([k, v]) => [k, { ...v, log: (v.log || []).filter((m) => !m.pending).slice(-40) }])))); } catch {} } };
// a body on the map ⇄ what the console shows. The planets of linked AIs carry their vendor; the pool agents their adapter.
const VENDOR_ADAPTER = { claude_code: "claude_local", chatgpt: "codex_local", codex: "codex_local", hermes: "hermes_local", workbuddy: "codebuddy_local", codebuddy: "codebuddy_local", gemini: "gemini_local" };

async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || (opts.body ? "POST" : "GET"),
    headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) { const e = new Error((data && (data.detail?.toString?.() || data.error)) || res.statusText); e.status = res.status; throw e; }
  return data;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 3200); }
function ago(iso) {
  if (!iso) return ""; const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 0) return "马上"; if (d < 60) return "刚刚"; if (d < 3600) return Math.floor(d / 60) + " 分钟前"; if (d < 86400) return Math.floor(d / 3600) + " 小时前";
  return new Date(iso).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function until(iso) {
  if (!iso) return ""; const d = (new Date(iso).getTime() - Date.now()) / 1000;
  if (d <= 0) return "现在"; if (d < 60) return Math.ceil(d) + " 秒后"; if (d < 3600) return Math.ceil(d / 60) + " 分钟后";
  return new Date(iso).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
const dur = (s) => s == null ? "" : s < 60 ? `${Math.round(s)} 秒` : s < 3600 ? `${Math.floor(s / 60)} 分 ${Math.round(s % 60)} 秒` : `${(s / 3600).toFixed(1)} 小时`;
const STATE = { running: ["工作中", "on"], paused: ["已暂停", ""], stopped: ["已停止", ""], idle: ["未开始", ""] };
const STEP = { think: "思考", investigate: "研究", evolve: "进化", reflect: "回顾", checkpoint: "检查点", review: "审核", ask: "对话" };

                ["checkpoint", "检查点", "想一段时间后停下来，把发现、整体思路和选项交给你；你同意了才动手"],
                ["driven", "用户驱动", "不自己行动；你在下面提要求，它按你的要求回答或修改"]];
const ROLE = { lead: "主导", researcher: "研究员", critic: "审阅", builder: "实现" };
const KIND = { question: "提问", answer: "回答", insight: "发现", evolve: "进化", reflect: "回顾", correction: "你的指正", checkpoint: "检查点" };

/* ------------------------------------------------ data */

async function boot() {
  if (!C.uid) { try { const h = await api("/healthz"); C.uid = h.owner; } catch {} }
  if (!C.uid) { $("#proc").innerHTML = `<div class="idle">还没有账号：先打开一次 <a href="/?sky">星空</a>。</div>`; return; }
  try { const u = await api(`/v1/users/${C.uid}`); const into = u.preferences?.merged_into; if (into && into !== C.uid) { C.uid = into; if (!AS_UID) store.set("pga_uid", into); } }
  catch (e) { if (e.status === 404) { $("#proc").innerHTML = `<div class="idle">这个账号不存在了：先打开一次 <a href="/?sky">星空</a>。</div>`; return; } }
  $("#map").src = `/?embed=map&as=${encodeURIComponent(C.uid)}`;
  const v = AS_UID ? null : store.get("pga_console_view");
  try { if (v) C.view = JSON.parse(v); } catch {}
  if (C.view.kind === "aim") C.view.id = C.sel;
  api(`/v1/users/${C.uid}/graph`).then((g) => { C.graph = g; }).catch(() => {});
  await loadAll();
  setInterval(() => loadOverview().catch(() => {}), 6000);
  setInterval(() => loadLive().catch(() => {}), 1500);
  setInterval(() => { if (C.view.kind === "aim" && C.sel) loadProcess().catch(() => {}); }, 8000);
}
async function loadAll() {
  await loadOverview();
  if (C.view.kind === "aim") await loadProcess();
  else { renderCenter(); loadHist(C.view.kind === "me" ? chat("me").agent : C.view.id).catch(() => {}); }
}

/* ------------------------------------------------ what is selected: a motivation, 我, or an agent — map and panels together */

function setView(kind, id, fromMap = false) {
  C.view = { kind, id };
  if (!AS_UID) store.set("pga_console_view", JSON.stringify(C.view));
  if (kind === "aim") { C.sel = id; if (!AS_UID) store.set("pga_console_aim", id); C.proc = null; }
  if (!fromMap) focusMap();
  renderAims(); renderAgents(); renderCenter(); renderMini();
  if (kind === "aim") loadProcess().catch(() => {});
  if (kind !== "aim") loadHist(kind === "me" ? chat("me").agent : id).catch(() => {});
}
function mapNodeOf(view) {
  if (!view) return null;
  if (view.kind === "aim") return "aim:" + view.id;
  if (view.kind === "me") return "you";
  if (view.kind === "agent") {
    const a = (C.data?.agents || []).find((x) => x.name === view.id);
    const n = (C.graph?.nodes || []).find((x) => x.kind === "ai" && VENDOR_ADAPTER[x.vendor] === a?.adapter);
    return n ? n.id : null;
  }
  return null;
}
function focusMap(id = mapNodeOf(C.view)) {
  try { $("#map").contentWindow.postMessage({ type: "pga:focus", id }, location.origin); } catch {}
}

/* the small disc on the left: you in the middle, the agents round you, the motivations further out — flattened like the
   dispatch constellation's map; the one you are on is ringed, the working ones ripple */
function renderMini() {
  const svg = $("#miniSvg"); if (!svg || !C.data) return;
  const W = svg.clientWidth || 280, H = Math.round(W * .72), cx = W / 2, cy = H / 2 + 8, SQ = .5;
  const agents = (C.data.agents || []).filter((a) => a.name !== "?"), aims = C.data.aims || [];
  const live = new Set((C.live || []).filter((r) => r.running).map((r) => r.agent));
  const r1 = Math.min(W * .26, 70), r2 = Math.min(W * .45, 124);
  const cur = C.view.kind === "me" ? "you" : C.view.kind === "agent" ? "ag:" + C.view.id : "aim:" + C.view.id;
  const pos = (i, n, r, off = 0) => { const t = off + i / Math.max(1, n) * Math.PI * 2; return [cx + Math.cos(t) * r, cy + Math.sin(t) * r * SQ]; };
  const workingAims = new Set(aims.filter((a) => a.task?.working?.length).map((a) => a.id));
  let out = `<ellipse class="orb" cx="${cx}" cy="${cy}" rx="${r1}" ry="${r1 * SQ}"/><ellipse class="orb" cx="${cx}" cy="${cy}" rx="${r2}" ry="${r2 * SQ}"/>`;
  const A = aims.map((a, i) => [a, ...pos(i, aims.length, r2, -Math.PI / 2)]);
  const G = agents.map((a, i) => [a, ...pos(i, agents.length, r1, -Math.PI / 2 + .4)]);
  for (const [a, x, y] of A) for (const w of a.task?.working || []) { const g = G.find(([b]) => b.name === w.agent); if (g) out += `<line class="ln lit" x1="${g[1]}" y1="${g[2]}" x2="${x}" y2="${y}"/>`; }
  out += `<g class="nd you ${cur === "you" ? "is-cur" : ""}" data-mini="me" transform="translate(${cx},${cy})"><title>我 · 直接让 agent 做事</title><circle class="body" r="5"/>${cur === "you" ? `<circle class="cur" r="11"/>` : ""}<text y="17">我</text></g>`;
  for (const [a, x, y] of G) {
    const q = a.quota || {}, rem = q.remaining != null ? Math.max(0, Math.min(1, q.remaining)) : null, R = 5, ra = R + 2.6, id = "ag:" + a.name;
    const arc = rem != null && rem > 0 ? (rem >= .999 ? `<circle class="rem" r="${ra}"/>` : (() => { const t = -Math.PI / 2 + rem * Math.PI * 2;
      return `<path class="rem" d="M 0 ${-ra} A ${ra} ${ra} 0 ${rem > .5 ? 1 : 0} 1 ${(ra * Math.cos(t)).toFixed(2)} ${(ra * Math.sin(t)).toFixed(2)}"/>`; })()) : "";
    out += `<g class="nd ${a.enabled === false || a.available === false ? "off" : ""} ${live.has(a.name) ? "running" : ""} ${cur === id ? "is-cur" : ""}" data-mini="agent:${esc(a.name)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
      <title>${esc(a.name)}${live.has(a.name) ? " · 正在工作" : ""}</title><circle class="run" r="${R}"/><circle class="body" r="${R}"/>${arc}${cur === id ? `<circle class="cur" r="${R + 6}"/>` : ""}<text y="${R + 12}">${esc(a.name)}</text></g>`;
  }
  for (const [a, x, y] of A) {
    const id = "aim:" + a.id, short = a.text.length > 10 ? a.text.slice(0, 9) + "…" : a.text;
    out += `<g class="nd aim ${workingAims.has(a.id) ? "running" : ""} ${cur === id ? "is-cur" : ""}" data-mini="aim:${a.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
      <title>${esc(a.text)}</title><circle class="halo" r="12"/><circle class="run" r="7"/><circle class="body" r="7"/>${cur === id ? `<circle class="cur" r="15"/>` : ""}<text y="-17">${esc(short)}</text></g>`;
  }
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.height = H + "px"; svg.innerHTML = out;
}
/* the sky ⇄ the workbench, the way a planet is talked to in the dispatch constellation: the view glides to the body,
   everything else fades, and the workbench appears beside it, tied to it by a fine gold line */
function toDesk() {

  document.body.classList.remove("sky");

}
function toSky() {

  focusMap(null);                                                    // back to the whole, calm sky
}
function leadLine() {                                               // the fine gold line from the planet to its words
  requestAnimationFrame(leadLine);
  const svg = $("#lead"); if (!svg || document.body.classList.contains("sky")) return;
  let b = null;
  try { b = $("#map").contentWindow.PGA_BODY?.(mapNodeOf(C.view)); } catch {}
  const l = svg.querySelector("line"), c = svg.querySelector("circle"), cen = $("#center").getBoundingClientRect(), st = $(".stage").getBoundingClientRect();
  if (!b || !b.visible || innerWidth <= 900) { svg.style.visibility = "hidden"; return; }

requestAnimationFrame(leadLine);

  if (e.origin !== location.origin || e.data?.type !== "pga:select") return;
  const d = e.data;

    const a = (C.data?.agents || []).find((x) => x.adapter === VENDOR_ADAPTER[d.vendor] && x.enabled !== false) || (C.data?.agents || []).find((x) => x.adapter === VENDOR_ADAPTER[d.vendor]);
    if (a) { setView("agent", a.name, true); return go(); }

  }
});

}

/* ------------------------------------------------ left: motivations → projects */

function runBtn(p, big) {
  const on = p.state === "running", busy = C.busy.has(p.id);
  const label = busy ? "…" : on ? "⏸ 暂停" : "▶ 开始";
  const title = !p.aim_id ? "先把这个文件夹挂到一个抱负下，才能开始" : on ? "暂停这个项目：正在做的事也会停下" : "开始：它的抱负在这个文件夹里不停地思考、提问、研究、进化";
  return `<button class="run ${on ? "" : "primary"} ${big ? "bigrun" : ""}" data-run="${p.id}" data-act="${on ? "pause" : "start"}" title="${esc(title)}" ${busy || !p.aim_id ? "disabled" : ""}>${label}</button>`;
}
function projRow(p) {
  const [zh, cls] = STATE[p.state] || STATE.idle;
  const note = p.state === "running" && p.phase_zh ? p.phase_zh : zh;
  return `<div class="proj"><span class="dot ${p.working ? "on" : cls === "on" ? "ok" : ""}"></span>
    <div class="n">${esc(p.name)}<small>${esc(note)} · ${esc(p.path.replace(/^\/Users\/[^/]+/, "~"))}</small></div>${runBtn(p)}</div>`;
}
function renderAims() {
  const d = C.data; if (!d) return;

  $("#aims").innerHTML = `<div class="aim me ${C.view.kind === "me" ? "sel" : ""}" data-me="1"><div class="t">我</div>
      <div class="st"><span class="dot ${working ? "on" : ""}"></span>直接让任何 agent 做短程的事${working ? ` · ${working} 个在做` : ""}</div></div>` + aims.map((a) => {
    const t = a.task; const [zh] = STATE[t?.status || "idle"] || STATE.idle;
    const live = t?.working?.length || 0;
    return `<div class="aim ${C.view.kind === "aim" && a.id === C.sel ? "sel" : ""}" data-aim="${a.id}">
      <div class="t">${esc(a.text)}</div>
      <div class="st"><span class="dot ${live ? "on" : t?.status === "running" ? "ok" : ""}"></span>${t ? `${esc(zh)} · ${esc(t.phase_zh || "")}` : "还没有开始"}${live ? ` · ${live} 个 agent 在做` : ""}</div>
      ${t ? `<div class="bar ${live ? "gold" : ""}" title="张力 ${(t.pressure ?? 0).toFixed(2)}"><i style="width:${Math.round((t.pressure ?? 0) * 100)}%"></i></div>` : ""}
      ${t?.checkpoint_pending ? `<div class="q">● 检查点等你看</div>` : ""}
      ${a.open_questions ? `<div class="q">● ${a.open_questions} 个问题等你回答</div>` : ""}
      <div class="projs">${a.projects.map(projRow).join("") || `<div class="empty">还没有项目文件夹（在星空 → 项目里把文件夹挂到这个抱负下）</div>`}</div>
    </div>`;
  }).join("") + (d.free_projects?.length ? `<div class="aim free"><div class="cap">自由文件夹</div><div class="projs">${d.free_projects.map(projRow).join("")}</div>
      <div class="empty">不属于任何抱负的文件夹不能自己开始：在星空 → 项目里选「属于」。</div></div>` : "")
    || `<div class="aim"><div class="empty">还没有抱负。先在 <a href="/?sky">星空</a> 写下一个长期抱负。</div></div>`;
}

/* ------------------------------------------------ center: the process */

function projectOf(aim) {

      ${a?.stats ? `<span>工作 <b>${dur(a.stats.work_s)}</b> · 休息 <b>${dur(a.stats.rest_s)}</b></span>` : ""}</div>

      <div class="dim" style="font-size:11.5px">哪一种压力最大，下一轮就做哪一种：思考 = 提出新问题，研究 = 回答问题，进化 = 改进代码，回顾 = 整理反思。</div>`
      : `<div class="meta">还没有开始。${proj ? "按右上角 ▶ 开始，它就会在这个文件夹里不停地思考、提问、研究和进化。" : ""}</div>`}
    ${t ? `<div class="levels">${LEVELS.map(([k, zh, d]) => `<button data-level="${k}" class="${(t.autonomy || "checkpoint") === k ? "on" : ""}"><b>${zh}</b><span>${d}</span></button>`).join("")}</div>

    ${qs.length ? `<h2>等你回答 <small>只有你能决定的问题</small></h2>${qs.map((q) => `<div class="ask"><div class="qt">${esc(q.text)}</div>${q.data?.why ? `<div class="dim" style="font-size:12px;margin:-4px 0 8px">为什么问你：${esc(q.data.why)}</div>` : ""}
      <textarea data-q="${q.id}" placeholder="你的回答会成为这个抱负的指导，之后每一轮都会读到">${esc(C.drafts[q.id] || "")}</textarea>

/* ------------------------------------------------ 我 and each agent: a conversation, what they are doing, their past */

function chat(key) {
  const c = (C.chats[key] ||= { agent: key === "me" ? (store.get("pga_console_agent") || "auto") : key.slice(6), conv: null, log: [], project: null });
  if (!c.conv) c.conv = (c.agent === "auto" ? "cat:serious" : "agent:" + c.agent) + ":console-" + Math.random().toString(36).slice(2, 10);
  return c;
}
function allProjects() { return [...(C.data?.aims || []).flatMap((a) => a.projects), ...(C.data?.free_projects || [])]; }
function chatHtml(key) {

async function sendChat(key) {
  const c = chat(key), box = $("#chatText");
  const text = (box?.value || "").trim(); if (!text) { toast("先写下你要它做什么"); return; }
  const proj = allProjects().find((p) => p.id === c.project);
  if (proj?.full_access && !confirm(`${c.agent === "auto" ? "agent" : c.agent} 可以在「${proj.name}」里修改文件、执行命令。确定吗？`)) return;
  const history = (c.log || []).filter((m) => !m.pending).slice(-6).map((m) => ({ role: m.role === "user" ? "user" : "assistant", text: m.text || "" }));
  c.log.push({ role: "user", text }); const pend = { role: "agent", pending: true, agent: c.agent }; c.log.push(pend);
  c.sending = true; C.drafts["chat:" + key] = ""; if (box) box.value = ""; renderCenter();
  try {
    const r = await api(`/v1/users/${C.uid}/agents/ask`, { body: { text, agent: c.agent, category: c.agent === "auto" ? "serious" : null, history,
      conversation: c.conv, project_id: c.project || null } });
    Object.assign(pend, { pending: false, agent: r.agent, text: r.text, error: r.error, model: r.model });
  } catch (err) { Object.assign(pend, { pending: false, error: err.message }); }
  finally { c.sending = false; saveChats(); }
  if (C.view.kind !== "aim") renderCenter();
}
async function resumeConv(id, agent) {
  const key = C.view.kind === "me" ? "me" : "agent:" + agent;
  const c = chat(key);
  try {
    const r = await api(`/v1/users/${C.uid}/agents/conversation?id=${encodeURIComponent(id)}`);
    c.log = (r.messages || []).map((m) => m.role === "user" ? { role: "user", text: m.text } : { role: "agent", agent: m.agent, model: m.model, text: m.text, error: m.ok === false ? m.error : null });
    c.conv = id; if (key === "me") c.agent = agent; saveChats(); renderCenter();
  } catch (err) { toast("没能打开：" + err.message); }
}

function renderLive() {

  if (t.name === "cpopt") C.cp.option = Number(t.value);
  if (t.dataset.cpp) { C.cp.approve = C.cp.approve || new Set(); t.checked ? C.cp.approve.add(t.dataset.cpp) : C.cp.approve.delete(t.dataset.cpp); }
  if (t.id === "cpEvery") {
    try { await api(`/v1/aims/${C.sel}/perpetual`, { method: "PATCH", body: { settings: { checkpoint_every: Number(t.value) } } }); toast("已更新"); await loadProcess(); }
    catch (err) { toast(err.message); }
  }
});
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, .aim[data-aim], .aim[data-me], .ag[data-ag]");
  if (!t) return;
  try {
    if (t.dataset.run) {
      e.stopPropagation();
      const act = t.dataset.act;
      if (act === "pause" && !confirm("暂停这个项目？正在进行的那一步也会停下（已经说过的会保留）。")) return;
      C.busy.add(t.dataset.run); renderAims(); renderProcess();
      try {
        const r = await api(`/v1/users/${C.uid}/projects/${t.dataset.run}/run`, { body: { action: act } });
        toast(act === "start" ? "已开始：它会在这个文件夹里不停地思考和工作" : `已暂停${r.stopped?.length ? `，停下了 ${r.stopped.length} 个正在进行的步骤` : ""}`);
      } finally { C.busy.delete(t.dataset.run); }
      await loadAll(); return;
    }
    if (t.dataset.aim && !e.target.closest("button")) { setView("aim", t.dataset.aim); return; }
    if (t.dataset.me && !e.target.closest("button")) { setView("me", null); return; }
    if (t.dataset.ag && !e.target.closest("button")) { setView("agent", t.dataset.ag); return; }
    if (t.id === "toSky") { toSky(); return; }
    if (t.id === "toDesk") { toDesk(); return; }
    if (t.dataset.chatsend) { await sendChat(t.dataset.chatsend); return; }
    if (t.dataset.chatnew) { const c = chat(t.dataset.chatnew); c.log = []; c.conv = null; chat(t.dataset.chatnew); saveChats(); renderCenter(); return; }
    if (t.dataset.resume) { await resumeConv(t.dataset.resume, t.dataset.agent); return; }
    if (t.dataset.open) {
      const id = t.dataset.open;
      if (C.open.has(id)) C.open.delete(id); else { C.open.add(id); if (!C.details[id]) { renderProcess(); C.details[id] = await api(`/v1/users/${C.uid}/console/runs/${id}`); } }
      renderProcess(); return;
    }
    if (t.dataset.level) {
      const lv = t.dataset.level;
      if (lv === "free" && !confirm("完全自由：它会自己改代码、自己评测，验证通过的改进会自动上线（先灰度，变差自动回滚）。确定吗？")) return;
      await api(`/v1/aims/${C.sel}/perpetual`, { method: "PATCH", body: { settings: { autonomy: lv } } });
      toast(`已切换为「${LEVELS.find((x) => x[0] === lv)[1]}」`); await loadAll(); return;
    }
    if (t.dataset.cp) {
      const cp = C.proc?.checkpoint; if (!cp) return;
      const text = ($("#cpText")?.value || "").trim();
      if (t.dataset.cp === "adjust" && !text) { toast("先写下你的意见"); $("#cpText")?.focus(); return; }
      if (t.dataset.cp === "stop" && !confirm("停下：这个抱负会暂停，直到你按 ▶ 开始。")) return;
      await api(`/v1/aims/${C.sel}/perpetual/checkpoint`, { body: { note_id: cp.id, decision: t.dataset.cp, text,
        option: C.cp.option, approve: [...(C.cp.approve || [])] } });
      delete C.drafts["cp:" + cp.id];
      toast({ continue: "已同意，继续", adjust: "已按你的意见调整", stop: "已停下" }[t.dataset.cp]); await loadAll(); return;
    }
    if (t.dataset.talk) {
      const text = ($("#talkText")?.value || "").trim(); if (!text) { toast("先写下你要它做什么"); return; }
      const agent = $("#talkAgent")?.value; const proj = projectOf(C.proc?.aim);
      if (proj?.full_access && !confirm(`${agent} 可以在「${proj.name}」里修改文件、执行命令。确定吗？`)) return;
      C.talk.agent = agent; if (!AS_UID) store.set("pga_console_agent", agent);
      C.talk.sending = true; C.drafts.talk = ""; renderProcess();
      const aim = C.sel;
      try {
        const r = await api(`/v1/users/${C.uid}/agents/ask`, { body: { text, agent, project_id: proj?.id, category: "serious" } });
        C.talk.last = { aim, agent: r.agent, text: r.text, error: r.error };
      } catch (err) { C.talk.last = { aim, agent, error: err.message }; }
      finally { C.talk.sending = false; }
      renderProcess(); return;
    }
    if (t.dataset.stoplive) { await api(`/v1/agents/live/${t.dataset.stoplive}/stop`, { body: {} }); toast("已让它停下"); return; }
    if (t.dataset.agstop) { const r = await api(`/v1/agents/${encodeURIComponent(t.dataset.agstop)}/stop`, { body: {} }); toast(r.stopped.length ? `停下了 ${r.stopped.length} 个正在进行的工作` : "它现在没有在工作"); return; }
    if (t.dataset.agenable) {
      const on = t.dataset.on === "1";
      if (!on && !confirm(`停用 ${t.dataset.agenable}？它正在做的事会停下，之后不会再给它派活，直到你重新启用。`)) return;
      await api(`/v1/agents/${encodeURIComponent(t.dataset.agenable)}/enabled`, { body: { enabled: on } });
      toast(on ? "已启用" : "已停用"); await loadOverview(); return;
    }
    if (t.dataset.answer || t.dataset.drop) {
      const id = t.dataset.answer || t.dataset.drop;
      const text = t.dataset.answer ? ($(`textarea[data-q="${CSS.escape(id)}"]`)?.value || "").trim() : "";
      if (t.dataset.answer && !text) { toast("先写下你的回答"); return; }
      await api(`/v1/aims/${C.sel}/perpetual/answer`, { body: t.dataset.answer ? { note_id: id, text } : { note_id: id, drop: true } });
      delete C.drafts[id]; toast(t.dataset.answer ? "已回答：之后的每一轮都会读到" : "已放下这个问题"); await loadAll(); return;
    }
  } catch (err) { toast("没能完成：" + err.message); }
});

boot();
</script>
</body>
</html>
