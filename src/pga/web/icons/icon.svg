<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- PGA: the black hole at the centre of the map, as plainly as possible — the hole, one ring of light, and the
       disk crossing in front of it. Flat colours, so it still reads at 16 px. macOS icon grid: an 824-px rounded
       square, 100 px in from each edge. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c27"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <!-- the part of the disk in front of the hole: the lower half, in the disk's own (tilted) frame -->
    <clipPath id="front"><path d="M 262 512 A 250 250 0 0 0 762 512 Z" transform="rotate(-12 512 512)"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- the disk, whole (the hole covers the part behind it) -->
    <ellipse cx="512" cy="512" rx="318" ry="74" fill="none" stroke="#c8732a" stroke-width="30" transform="rotate(-12 512 512)"/>
    <!-- the hole and its ring of light -->
    <circle cx="512" cy="512" r="176" fill="#020305"/>
    <circle cx="512" cy="512" r="176" fill="none" stroke="#f3c47a" stroke-width="24"/>
    <!-- the disk again where it passes in front -->
    <g clip-path="url(#front)">
      <ellipse cx="512" cy="512" rx="318" ry="74" fill="none" stroke="#e9a94b" stroke-width="30" transform="rotate(-12 512 512)"/>
    </g>
  </g>
</svg>
