<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思考树 · PGA</title>
<link rel="icon" href="/icons/favicon-32.png?v=3">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="/ui/tree.js"></script>
<style>
:root {
  --bg: #050505; --panel: #0a0b0d; --text: #e8e8e8; --muted: #8a8a8a; --dim: #555;
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.2); --line-3: rgba(255,255,255,.42);
  --gold: #e9a94b; --gold-dim: rgba(233,169,75,.35); --green: #96d6a0; --bad: #f08a7a; --link: #9cc3e6;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: var(--link); } button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line-2); background: transparent; padding: 4px 10px; white-space: nowrap; }
button:hover { border-color: var(--line-3); } button.primary { border-color: var(--gold); color: var(--gold); } button.primary:hover { background: rgba(233,169,75,.1); }
button.danger:hover { border-color: var(--bad); color: var(--bad); } button:disabled { opacity: .45; cursor: default; }
select, input[type=text] { background: #0a0a0a; border: 1px solid var(--line-2); padding: 3px 6px; outline: none; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header { display: flex; align-items: center; gap: 16px; padding: 9px 18px; border-bottom: 1px solid var(--line); background: #000; flex-wrap: wrap; }
header .logo { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; letter-spacing: .3em; font-size: 13px; }
header .logo img { width: 18px; height: 18px; }
header nav { display: flex; gap: 4px; } header nav a { text-decoration: none; padding: 4px 12px; border: 1px solid transparent; color: var(--muted); }
header nav a.on { border-color: var(--line-2); color: var(--text); } header nav a:hover { color: var(--text); }
header .aimpick { max-width: 320px; }
.run { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); margin-left: auto; flex-wrap: wrap; }
.run .st b { color: var(--text); font-weight: 400; } .run .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #555; margin-right: 5px; }
.run .dot.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: beat 1.6s infinite; } @keyframes beat { 50% { opacity: .4; } }
.pbar { width: 90px; height: 5px; background: var(--line); position: relative; } .pbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #6fa8d8, var(--gold), #f08a7a); }
.gold { color: var(--gold); } .dim { color: var(--muted); } .mono { font-family: var(--mono); }
main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(400px, .95fr); min-height: 0; }
#treeSide { position: relative; overflow: auto; border-right: 1px solid var(--line);
  background: radial-gradient(ellipse at 50% 100%, rgba(233,169,75,.1), transparent 60%), radial-gradient(ellipse at 50% 0%, rgba(120,150,170,.06), transparent 55%), #060709; }
#treeSide svg { display: block; margin: 0 auto; }
#treeSide .legend { position: sticky; top: 0; z-index: 2; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 8px 14px; font-size: 11.5px; color: var(--muted); background: linear-gradient(#060709 65%, transparent); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(232,236,238,.85); margin-right: 5px; vertical-align: -1px; }
.legend i.g { border-color: var(--green); } .legend i.f { border-color: var(--gold); background: var(--gold); } .legend i.b { border-radius: 50% / 35%; border-color: var(--gold); } .legend i.x { border-color: var(--link); }
.legend label { margin-left: auto; cursor: pointer; }
.legend .modes { display: inline-flex; border: 1px solid var(--line-2); } .legend .modes button { border: 0; padding: 1px 10px; font-size: 11.5px; color: var(--muted); }
.legend .modes button.on { color: var(--gold); background: rgba(233,169,75,.1); }
.cont .crefs { margin: 0 0 8px; } .cont .crefs .chip a { color: inherit; text-decoration: none; margin-left: 4px; } .legend .act { color: var(--gold); cursor: pointer; text-decoration: underline; }
#nodeSide { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; background: var(--panel); }
.nh { padding: 14px 22px 10px; border-bottom: 1px solid var(--line); }
.nh .crumb { font-size: 11.5px; color: var(--muted); } .nh .crumb a { color: var(--muted); text-decoration: none; } .nh .crumb a:hover { color: var(--text); }
.nh .t { display: flex; gap: 12px; align-items: baseline; margin: 6px 0 4px; } .nh h1 { margin: 0; font-size: 19px; font-weight: 400; line-height: 1.45; flex: 1; }
.nh .k { font: 10px var(--mono); letter-spacing: .14em; color: var(--gold); white-space: nowrap; }
.nh .nav, .nh .ops { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; } .nh .nav button, .nh .ops button { font-size: 12px; padding: 2px 9px; }
.nh .ops button { border-color: var(--line); color: #b9c0c4; } .nh .ops button:hover { color: var(--text); border-color: var(--line-3); } .nh .ops button.on { border-color: var(--gold); color: var(--gold); }
.form { margin: 10px 0 2px; padding: 10px 12px; border: 1px solid var(--line-2); background: #0c0e10; display: grid; gap: 8px; }
.form input[type=text], .form textarea, .form select { width: 100%; background: #08090b; border: 1px solid var(--line-2); padding: 5px 8px; }
.form textarea { min-height: 90px; resize: vertical; } .form .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.tabs { display: flex; padding: 0 22px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); }
.tabs button.on { color: var(--text); border-bottom-color: var(--gold); } .tabs small { color: var(--dim); margin-left: 3px; }
.body { overflow: auto; padding: 16px 22px 30px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.shift { margin: 4px 0 14px; color: rgba(233,169,75,.92); font-size: 13.5px; line-height: 1.7; }
.keys { padding-left: 0; list-style: none; display: grid; gap: 6px; } .keys li { padding: 6px 10px; border-left: 2px solid var(--gold-dim); background: rgba(255,255,255,.025); }
h3 { font: 500 10.5px var(--mono); letter-spacing: .22em; color: rgba(233,169,75,.85); margin: 22px 0 10px; }
h3 small { letter-spacing: .04em; color: var(--dim); font-size: 11px; } h3 small a { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { border: 1px solid var(--line-2); padding: 2px 9px; font-size: 12px; cursor: pointer; background: transparent; }
.chip.on { border-color: var(--gold); color: var(--gold); } .chip.user { border-color: rgba(150,214,160,.6); color: var(--green); } .chip.exchange { border-color: rgba(156,195,230,.6); color: var(--link); }
.bud { display: flex; gap: 10px; align-items: flex-start; margin: 6px 0; } .bud .i { color: var(--gold); flex: 1; }
.counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.counts div { border: 1px solid var(--line); padding: 7px 10px; } .counts b { display: block; font-size: 18px; font-weight: 400; } .counts span { font-size: 11.5px; color: var(--muted); }
.filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.filters input { flex: 1; min-width: 140px; background: #0c0e10; border: 1px solid var(--line-2); padding: 3px 8px; outline: none; }
.kcard { border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 10px; } .kcard .kt { display: flex; gap: 10px; align-items: baseline; }
.kcard .kt b { font-weight: 500; flex: 1; } .kcard .kg { color: #c9d0d4; font-size: 12.5px; margin-top: 4px; } .kcard .ka { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.tagk { font: 10px var(--mono); letter-spacing: .1em; padding: 1px 6px; border: 1px solid var(--line-2); color: var(--muted); }
.commit, .file { display: flex; gap: 10px; margin: 5px 0; font-size: 12.5px; } .commit a, .file a { font-family: var(--mono); } .commit time { color: var(--muted); margin-left: auto; white-space: nowrap; } .file span { color: var(--muted); }
.cont { border-top: 1px solid var(--line); padding: 12px 22px 14px; background: #07080a; }
.cont textarea { width: 100%; min-height: 52px; max-height: 200px; resize: vertical; background: #0c0e10; border: 1px solid var(--line-2); padding: 8px 10px; outline: none; }
.cont textarea:focus { border-color: var(--gold-dim); } .cont .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; } .cont .grow { flex: 1; }
.empty { padding: 40px 22px; color: var(--muted); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 30; }
.modal .box { width: min(860px, 92vw); max-height: 86vh; overflow: auto; background: #0b0c0e; border: 1px solid var(--line-2); padding: 20px 26px; }
.modal .box h2 { margin: 0 0 6px; font-weight: 400; } .md p { margin: .5em 0; } .md h1, .md h2, .md h3 { font-family: var(--font); letter-spacing: normal; color: var(--text); font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; border: 1px solid var(--line-2); padding: 8px 14px; font-size: 12.5px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 40; }
#toast.on { opacity: 1; }
#enter { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: radial-gradient(circle at 50% 70%, rgba(233,169,75,.25), #000 70%); animation: enter 1s ease forwards; }
@keyframes enter { from { opacity: 1; } to { opacity: 0; } }
@media (max-width: 900px) { body { overflow: auto; } .app { height: auto; } main { grid-template-columns: 1fr; } #treeSide { height: 60vh; border-right: 0; border-bottom: 1px solid var(--line); } #nodeSide { min-height: 70vh; } }
</style>
</head>
<body>
<div id="enter"></div>
<div class="app">
  <header>
    <a class="logo" id="home" href="/forest"><img src="/icons/favicon-32.png?v=3" alt=""><b>PGA</b></a>
    <nav><a href="/forest" id="toForest">森林</a><a class="on" href="#">思考树</a></nav>
    <select class="aimpick" id="aimPick" title="换一棵树"></select>
    <div class="run" id="run"></div>
  </header>
  <main>
    <section id="treeSide" class="treewrap">
      <div class="legend" id="legend"></div>
      <svg id="treeSvg"></svg>
    </section>
    <section id="nodeSide">
      <div class="nh" id="nh"></div>
      <div class="tabs" id="tabs"></div>
      <div class="body" id="body"><div class="empty">载入中…</div></div>
      <div class="cont" id="cont"></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = PGATree.esc;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const Q = new URLSearchParams(location.search), AS_UID = Q.get("as");
const S = { uid: AS_UID || store.get("pga_uid"), aim: Q.get("you") ? "you" : Q.get("aim"), node: Q.get("node"), mode: store.get("pga_tree_mode") || "thought", beh: {}, contRefs: [], bud: null, tree: null, detail: {}, tab: store.get("pga_tree_tab") || "overview",
  filter: "all", search: "", seen: new Set(), agents: [], aims: [], sending: false, op: null, showHidden: false, forest: null, draft: "" };
const when = (iso) => iso ? new Date(iso).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const ago = (iso) => { if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? "刚刚" : s < 3600 ? `${Math.floor(s / 60)} 分钟前` : s < 86400 ? `${Math.floor(s / 3600)} 小时前` : `${Math.floor(s / 86400)} 天前`; };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3400); }
async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || (opts.body ? "POST" : "GET"), headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error((data && (data.detail?.toString?.() || data.error)) || res.statusText);
  return data;
}
const md = (t) => (window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t || "").replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>"))) : esc(t));
const YOU = () => S.aim === "you";
const treeApi = () => (YOU() ? `/v1/users/${S.uid}/tree` : `/v1/aims/${S.aim}/tree`);
const qs = () => { const q = new URLSearchParams(); if (YOU()) q.set("you", "1"); else if (S.aim) q.set("aim", S.aim); if (S.node) q.set("node", S.node); if (AS_UID) q.set("as", AS_UID); return "?" + q; };
const asq = AS_UID ? `?as=${encodeURIComponent(AS_UID)}` : "";

/* ------------------------------------------------ loading */
async function boot() {
  if (!S.uid) { try { S.uid = (await api("/healthz")).owner; } catch {} }
  $("#toForest").href = $("#home").href = "/forest" + asq;
  try { const d = await api(`/v1/users/${S.uid}/console`); S.aims = d.aims || []; S.agents = (d.agents || []).filter((a) => a.enabled !== false && a.name !== "?"); } catch {}
  if (!S.aim) S.aim = (S.aims.find((a) => a.task) || S.aims[0])?.id || "you";
  $("#aimPick").innerHTML = `<option value="you" ${YOU() ? "selected" : ""}>你的对话</option>` + S.aims.map((a) => `<option value="${a.id}" ${a.id === S.aim ? "selected" : ""}>${esc(a.text.length > 30 ? a.text.slice(0, 29) + "…" : a.text)}</option>`).join("");
  if (!S.aim) { $("#body").innerHTML = `<div class="empty">还没有抱负。去森林里种一颗。</div>`; return; }
  await loadTree();
  setInterval(() => loadTree(true).catch(() => {}), 20000);
}
async function loadProc() {
  if (YOU()) { S.proc = null; return; }
  try { S.proc = await api(`/v1/users/${S.uid}/console/aims/${S.aim}`); } catch { S.proc = null; }
}
async function loadTree(quiet) {
  [S.tree] = await Promise.all([api(treeApi()), loadProc()]);
  const nodes = (S.tree.nodes || []).filter((n) => n.kind !== "bud");
  if (!S.node || !nodes.some((n) => n.id === S.node)) S.node = (nodes.find((n) => n.tip) || nodes[nodes.length - 1])?.id || null;
  renderRun(); renderLegend(); drawTree(!quiet);
  if (!quiet) { renderNode(); if (S.node) loadNode(S.node); }
}
async function loadNode(id, force) {
  if (S.detail[id] && !force) { renderNode(); return; }
  try { S.detail[id] = await api(`/v1/thought-nodes/${id}?full=true`); } catch (e) { S.detail[id] = { error: e.message }; }
  if (S.node === id) renderNode();
}
async function forest() { if (!S.forest) S.forest = await api(`/v1/users/${S.uid}/forest`); return S.forest; }

/* ------------------------------------------------ the tree and how it is doing */
function renderRun() {
  const T = S.tree, t = T.task;
  if (YOU()) { $("#run").innerHTML = `<span>你在 PGA 里的对话，和从 Claude Code、ChatGPT、Hermes、WorkBuddy 导入的对话，按话题长成的树</span>`; return; }
  $("#run").innerHTML = t ? `<span class="st"><span class="dot ${t.status === "running" ? "on" : ""}"></span><b>${t.status === "running" ? "运行中" : t.status === "paused" ? "已暂停" : "已停止"}</b> · ${esc(t.phase_zh || "")}</span>
      <span title="张力：${Object.entries(t.parts || {}).filter(([, v]) => typeof v === "number").map(([k, v]) => `${k} ${v.toFixed(2)}`).join("，")}">张力 ${t.pressure.toFixed(2)} <span class="pbar"><i style="width:${Math.round(t.pressure * 100)}%"></i></span></span>
      <span>${esc(t.autonomy_zh || "")} · 每题 ${t.samples || 1} 次生成</span>
      ${T.for_you || S.proc?.checkpoint ? `<button class="primary" id="waitBtn">${[S.proc?.checkpoint ? "检查点等你看" : "", T.for_you ? `${T.for_you} 个问题等你回答` : ""].filter(Boolean).join(" · ")}</button>` : ""}
      <button id="setBtn" title="驱动模式、多次生成、分配">设置</button>
      ${T.project ? `<button id="runBtn" class="${t.status === "running" ? "" : "primary"}">${t.status === "running" ? "⏸ 暂停" : "▶ 开始"}</button>` : ""}`
    : `<span>这个抱负还没有在长期运行${T.project ? "" : "：先在工作台给它选一个工作文件夹"}</span>${T.project ? `<button id="runBtn" class="primary">▶ 开始</button>` : ""}`;
}
function renderLegend() {
  const T = S.tree, nodes = (T.nodes || []).filter((n) => n.kind !== "bud"), old = nodes.filter((n) => n.kind === "segment" && n.style !== 2 && !n.edited).length;
  const hidden = nodes.filter((n) => n.hidden).length, turns = nodes.reduce((a, n) => a + (n.turns || 0), 0);
  $("#legend").innerHTML = `<span class="modes"><button class="${S.mode === "thought" ? "on" : ""}" data-mode="thought">思维</button><button class="${S.mode === "behavior" ? "on" : ""}" data-mode="behavior" title="每个节点上 agent 做了什么：读、查、命令、改、提交">行为</button></span>
    ${S.mode === "behavior" ? `<span><i style="border-color:#6fa8d8"></i>读</span><span><i style="border-color:#5fc4b8"></i>查</span><span><i style="border-color:#e9a94b"></i>命令</span><span><i style="border-color:#f08a7a"></i>改</span><span><i style="border-color:#ffd27a"></i>提交</span>`
    : `<span><i></i>${YOU() ? "一段对话" : "一段思路"}</span>`}<span><i class="g"></i>你的分支</span><span><i class="x"></i>交流</span><span><i class="f"></i>选中 / PGA 的方向</span><span><i class="b"></i>花苞</span>
    <span>${nodes.length} 个节点 · ${turns} 轮</span>
    ${T.pending ? `<span class="act" id="curate">还有 ${T.pending} 轮没长进树里 · 整理</span>` : ""}
    ${old ? `<span class="act" id="rewrite" title="用更好读的格式重写这些节点的概括">${old} 个节点的概括可以更好读 · 重写</span>` : ""}
    ${hidden ? `<label><input type="checkbox" id="showHidden" ${S.showHidden ? "checked" : ""}> 显示隐藏的 ${hidden} 个</label>` : ""}`;
}
function drawTree(scroll) {
  const side = $("#treeSide");
  const L = PGATree.draw($("#treeSvg"), S.tree, Math.max(560, side.clientWidth), { sel: { id: S.node, bud: S.bud }, seen: S.seen, aimText: S.tree.aim?.text, labelChars: 26, showHidden: S.showHidden, mode: S.mode });
  if (scroll) { const n = L.list.find((x) => x.id === S.node) || L.list[L.list.length - 1]; if (n) side.scrollTop = Math.max(0, n.y - side.clientHeight * .4); }
  S.layout = L;
}
function select(id, bud = null) {
  if (!id) return;
  if (S.op === "exchange-pick" && id !== S.node) { S.exWith = id; S.op = "exchange"; renderNode(); return; }
  S.node = id; S.bud = bud; S.op = null;
  history.replaceState(null, "", qs());
  drawTree(false); renderNode(); loadNode(id);
}

/* ------------------------------------------------ one node, all of it */
const nodeOf = (id) => (S.tree?.nodes || []).find((n) => n.id === id);
const KTAG = { user: "你的分支", exchange: "交流", segment: "一段思路" };
const ktag = (n) => (n.scope === "user" && n.kind === "segment" ? "一段对话" : KTAG[n.kind] || "节点");
function renderNode() {
  const n = nodeOf(S.node);
  if (!n) { $("#nh").innerHTML = ""; $("#tabs").innerHTML = ""; $("#body").innerHTML = `<div class="empty">这棵树还没有长出节点。${S.tree?.pending ? "点左上的「整理」。" : ""}</div>`; $("#cont").innerHTML = ""; return; }
  const d = S.detail[n.id], notes = d?.notes || [], bud = S.bud != null ? (n.buds || [])[S.bud] : null;
  const list = S.layout?.list || [], i = list.findIndex((x) => x.id === n.id);
  const sampled = notes.filter((x) => x.kind === "answer" && x.data?.samples?.length), g = d?.git || {};
  const mine = n.kind !== "segment";
  $("#nh").innerHTML = `<div class="crumb">${(d?.path || []).slice(0, -1).map((x) => `<a href="#" data-go="${x.id}">${esc(x.title.length > 16 ? x.title.slice(0, 15) + "…" : x.title)}</a>`).join(" › ")}</div>
    <div class="t"><span class="k">${bud ? "灵感" : ktag(n)}${i >= 0 && !bud ? " · " + (i + 1) : ""}</span><h1>${esc(bud ? bud.idea : n.title)}</h1></div>
    ${bud ? "" : `<div class="ops">
      <button data-op="edit" class="${S.op === "edit" ? "on" : ""}">改名 / 改概括</button>
      <button data-op="branch" class="${S.op === "branch" ? "on" : ""}">新分支</button>
      <button data-op="exchange-pick" class="${S.op?.startsWith("exchange") ? "on" : ""}" title="和另一个节点（这棵树或别的树）交流">和别的分支交流</button>

/* ------------------------------------------------ doing things */
async function refresh(id) { S.forest = null; if (id) delete S.detail[id]; await loadTree(true); renderNode(); if (S.node) loadNode(S.node, true); }
async function send() {
  const n = nodeOf(S.node), text = ($("#tnText")?.value || "").trim(); if (!n) return;
  if (!text) { toast("先写下你要从这里问什么"); return; }
  const bud = S.bud != null ? (n.buds || [])[S.bud]?.idea : null;
  S.sending = true; S.draft = text; renderCont(n, S.bud != null);
  try {
    const r = await api(`/v1/thought-nodes/${n.id}/continue`, { body: { text, agent: $("#tnAgent")?.value || "auto", focus: !!$("#tnFocus")?.checked, bud, refs: S.contRefs } });
    if (r.reply?.error && !r.reply?.text) toast(r.reply.error);
    S.draft = ""; delete S.detail[r.node.id];
    await loadTree(true); S.node = r.node.id; S.bud = null; S.tab = "turns"; history.replaceState(null, "", qs());
    drawTree(true); await loadNode(r.node.id, true);
  } catch (err) { toast(err.message); }
  finally { S.sending = false; renderNode(); }
}
async function doOp(kind) {

      await api(`/v1/thought-nodes/${n.id}`, { method: "PATCH", body: { title: $("#fTitle").value, summary: $("#fSummary").value, key_thoughts: $("#fKeys").value.split("\n").map((x) => x.trim()).filter(Boolean) } });
      S.op = null; toast("已保存"); await refresh(n.id);
    } else if (kind === "branch") {
      const title = $("#fBranch").value.trim(); if (!title) { toast("写一句这条分支的方向"); return; }
      const b = await api(`/v1/thought-nodes/${n.id}/branch`, { body: { title } }); S.op = null; await loadTree(true); select(b.id); toast("长出了一条空分支：在下面写点什么，它就开始长");
    } else if (kind === "move") {
      await api(`/v1/thought-nodes/${n.id}`, { method: "PATCH", body: { parent_id: $("#fParent").value || null } }); S.op = null; toast("已移过去"); await refresh(n.id);
    } else if (kind === "pick-other") {
      const v = $("#fOther").value; if (!v) { toast("在左边点一个节点，或从列表里选"); return; }
      const [aim, id] = v.split("|"); S.exWith = id; S.exOther = ([...S.forest.trees, S.forest.you].find((t) => t && t.id === aim)?.nodes || []).find((x) => x.id === id); S.op = "exchange"; renderNode();
    } else if (kind === "exchange") {
      S.sending = true; renderNode();
      try {
        const r = await api(`/v1/thought-nodes/${n.id}/exchange`, { body: { with: S.exWith, text: $("#fExText")?.value || "" } });
        S.op = null; await loadTree(true); select(r.node.id); S.tab = "turns"; renderNode(); toast("交流完成：长成了一个交流节点");
      } finally { S.sending = false; }
    }
  } catch (err) { toast(err.message); }
}
async function quickOp(op) {

    if (op === "hide") { await api(`/v1/thought-nodes/${n.id}`, { method: "PATCH", body: { hidden: !n.hidden } }); toast(n.hidden ? "显示回来了" : "已隐藏（连同它长出去的）：勾选「显示隐藏的」可以看到"); await refresh(n.id); }

    else if (op === "delete") { if (!confirm(`删除「${n.title}」？对话仍留在抱负的记录里，只是不再显示在树上。`)) return; const parent = n.parent; await api(`/v1/thought-nodes/${n.id}`, { method: "DELETE" }); await loadTree(true); select(parent); toast("已删除"); }
    else if (op === "distill") {
      toast("正在沉淀这段思路…"); const r = await api(`/v1/thought-nodes/${n.id}/distill`, { method: "POST" });
      toast(r.status === "compiled" ? `已沉淀成一份数据集（${r.words} 词）` : r.status === "deferred" ? "现在额度不够，稍后再试" : `没有沉淀成：${r.note || r.status}`);

/* what used to need the workbench: questions only you can answer, checkpoints, and the settings */
const PRESETS = { performance: ["最高性能", { w_perf: 2.5, w_pref: 1, w_balance: .5, w_cost: 0, w_speed: .3, temperature: .25 }],
                  balanced: ["均衡模式", { w_perf: 1, w_pref: 1, w_balance: 1, w_cost: .4, w_speed: .3, temperature: .35 }],
                  economy: ["省钱模式", { w_perf: .6, w_pref: 1, w_balance: 2, w_cost: 2, w_speed: .2, temperature: .5 }] };
const LEVELS = [["free", "完全自由", "它自己想、自己研究，验证过的改进自动上线（出问题会回滚）"], ["checkpoint", "检查点", "每想几轮停下来，把发现和打算交给你决定"], ["driven", "用户驱动", "只在你提出要求时工作"]];
function modal(html) {

  m.addEventListener("click", (e) => { if (e.target === m) m.remove(); }); document.body.appendChild(m); return m;
}
function showWaiting() {

      ${(cp.proposals || []).length ? `<h3>要动手实现的改进（勾选才会做）</h3>${cp.proposals.map((p) => `<label style="display:block;margin:6px 0"><input type="checkbox" data-cpp="${esc(p.code)}" ${S.cpApprove.has(p.code) ? "checked" : ""}> <b>${esc(p.code)}</b> ${esc(p.title)}<div class="dim" style="margin-left:22px;font-size:12px">${esc(p.why || p.change || "")}</div></label>`).join("")}` : ""}
      <div class="form"><textarea id="cpText" placeholder="可选：你的看法或修正，会成为之后每一轮的指导"></textarea>
      <div class="row"><button data-cp="stop">停下</button><button data-cp="adjust">按我的意见调整后继续</button><button class="primary" data-cp="continue">同意，继续</button></div></div>` : ""}
    ${(P.for_you || []).length ? `<h2 style="margin-top:${cp ? 24 : 0}px">只有你能回答</h2>${P.for_you.map((q) => `<div class="form"><div>${esc(q.text)}</div>${q.data?.why ? `<div class="dim" style="font-size:12px">为什么问你：${esc(q.data.why)}</div>` : ""}
      <textarea data-q="${q.id}" placeholder="你的回答会成为这个抱负的指导，之后每一轮都会读到"></textarea>
      <div class="row"><button data-drop="${q.id}">不用回答</button><button class="primary" data-answer="${q.id}">回答</button></div></div>`).join("")}` : ""}`);
}
async function showSettings() {
  const t = S.proc?.task; if (!t) { toast("这个抱负还没有在长期运行：先按 ▶ 开始"); return; }
  let preset = "balanced"; try { preset = (await api(`/v1/aims/${S.aim}/allocation`)).settings?.preset || "balanced"; } catch {}
  modal(`<h2>设置</h2><div class="dim" style="margin-bottom:12px">这棵树的长期任务怎么跑。</div>
    <h3>驱动模式</h3>${LEVELS.map(([k, zh, d]) => `<label style="display:block;margin:6px 0"><input type="radio" name="lvl" value="${k}" ${(t.autonomy || "checkpoint") === k ? "checked" : ""}> <b style="font-weight:500">${zh}</b><div class="dim" style="margin-left:22px;font-size:12px">${d}</div></label>`).join("")}
    <div style="margin:6px 0 0 22px;font-size:12.5px">检查点：每想 <input type="number" id="setEvery" min="1" max="50" value="${t.checkpoint_every || 6}" style="width:52px"> 轮停下来一次</div>
    <h3>多次生成</h3><div style="font-size:12.5px">每个问题生成 <input type="number" id="setSamples" min="1" max="5" value="${t.samples ?? 3}" style="width:52px"> 次（不同 agent、稍加扰动的提示词，再合成并保留新想法）</div>
    <div style="font-size:12.5px;margin-top:6px">扰动强度 <input type="range" id="setPerturb" min="0" max="1" step="0.1" value="${t.perturb ?? .5}" style="vertical-align:middle"> <span id="pv">${(t.perturb ?? .5).toFixed(1)}</span></div>
    <h3>多 agent 分配</h3><div class="chips">${Object.entries(PRESETS).map(([k, [zh]]) => `<label class="chip ${k === preset ? "on" : ""}"><input type="radio" name="preset" value="${k}" ${k === preset ? "checked" : ""} style="display:none">${zh}</label>`).join("")}</div>
    <div class="form" style="border:0;background:none;padding:0;margin-top:16px"><div class="row"><button data-closemodal="1">取消</button><button class="primary" id="saveSettings">保存</button></div></div>`);
  document.querySelectorAll('input[name=preset]').forEach((r) => r.addEventListener("change", () => document.querySelectorAll('input[name=preset]').forEach((x) => x.parentElement.classList.toggle("on", x.checked))));
  $("#setPerturb").addEventListener("input", (e) => { $("#pv").textContent = Number(e.target.value).toFixed(1); });
}
async function saveSettings() {
  const lvl = document.querySelector('input[name=lvl]:checked')?.value, preset = document.querySelector('input[name=preset]:checked')?.value;
  const settings = { autonomy: lvl, checkpoint_every: Number($("#setEvery").value), samples: Number($("#setSamples").value), perturb: Number($("#setPerturb").value) };
  if (preset) settings.alloc = { preset, ...PRESETS[preset][1] };
  try { await api(`/v1/aims/${S.aim}/perpetual`, { method: "PATCH", body: { settings } }); document.querySelector(".modal")?.remove(); toast("已保存"); await loadTree(true); }
  catch (err) { toast(err.message); }
}
async function showDoc(id) {
  const d = await api(`/v1/bodies/${id}/document`).catch((e) => ({ error: e.message }));
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box">${d.error ? esc(d.error) : `<h2>${esc(d.title)}</h2><div class="dim" style="margin-bottom:10px">${esc(d.gist || "")}</div>${d.summary ? PGATree.summary(d.summary) : ""}<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="md">${md(d.full || "（还没有全文）")}</div>`}</div>`;
  m.addEventListener("click", (e) => { if (e.target === m) m.remove(); }); document.body.appendChild(m);
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-tnode], [data-tbud], [data-go], [data-goaim], [data-tab], [data-filter], [data-bud], [data-focus], [data-op], [data-do], [data-doc], [data-ref], [data-unref], [data-mode], [data-refadd], [data-unrefnode], [data-move], [data-crefdel], [data-answer], [data-drop], [data-cp], [data-closemodal], #send, #curate, #rewrite, #runBtn, #waitBtn, #setBtn, #saveSettings");
  if (!t) return;
  if (t.dataset.mode) { S.mode = t.dataset.mode; store.set("pga_tree_mode", S.mode); renderLegend(); drawTree(false); return; }
  if (t.dataset.crefdel) { e.preventDefault(); S.contRefs = S.contRefs.filter((x) => x !== t.dataset.crefdel); renderCont(nodeOf(S.node), S.bud != null); return; }
  if (t.dataset.refadd || t.dataset.unrefnode) {
    const n = nodeOf(S.node), add = $("#refAdd")?.value;
    const refs = t.dataset.unrefnode ? (n.refs || []).filter((x) => x !== t.dataset.unrefnode) : add ? [...(n.refs || []), add] : null;
    if (!refs) { toast("选一份知识"); return; }
    try { await api(`/v1/thought-nodes/${n.id}/refs`, { method: "PUT", body: { refs } }); toast(t.dataset.unrefnode ? "不再参考" : "从这里继续时，agent 会读到它"); await refresh(n.id); } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.move) {
    const to = $("#moveTo")?.value; if (!to) { toast("选一个节点"); return; }
    try { await api(`/v1/bodies/${t.dataset.move}/move`, { body: { node_id: to } }); toast("已移过去：它现在是那段思路沉淀出的知识"); await refresh(S.node); } catch (err) { toast(err.message); }
    return;
  }
  if (t.tagName === "A" || t.dataset.tab || t.dataset.go || t.dataset.goaim) e.preventDefault();
  if (t.dataset.tbud) { const [id, i] = t.dataset.tbud.split("|"); S.tab = "overview"; select(id, Number(i)); return; }
  if (t.dataset.tnode) { select(t.dataset.tnode); return; }
  if (t.dataset.go) { select(t.dataset.go); return; }
  if (t.dataset.goaim) { if (t.dataset.goaim === S.aim) { select(t.dataset.gonode); return; } location.href = `/tree?aim=${t.dataset.goaim}&node=${t.dataset.gonode}${AS_UID ? `&as=${AS_UID}` : ""}`; return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; store.set("pga_tree_tab", S.tab); renderNode(); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; renderNode(); return; }
  if (t.dataset.bud !== undefined) { S.bud = Number(t.dataset.bud); drawTree(false); renderNode(); $("#tnText")?.focus(); return; }
  if (t.dataset.op !== undefined) {
    const op = t.dataset.op;

    S.op = op || null; renderNode();

      const f = await forest().catch(() => null), sel = $("#fOther");
      if (f && sel) sel.innerHTML = `<option value="">（别的树的节点）</option>` + [...f.trees, ...(f.you ? [f.you] : [])].filter((x) => x.id !== S.aim && x.nodes.length).map((x) => `<optgroup label="${esc(x.text.slice(0, 30))}">${x.nodes.map((m) => `<option value="${x.id}|${m.id}">${esc(m.title)}</option>`).join("")}</optgroup>`).join("");
      toast("在左边的树上点另一个节点");
    }
    if (op === "branch") $("#fBranch")?.focus();
    return;
  }
  if (t.dataset.do) { doOp(t.dataset.do); return; }
  if (t.dataset.doc) { showDoc(t.dataset.doc); return; }
  if (t.dataset.ref) { const to = $("#refTo")?.value; if (!to) { toast("选一棵树"); return; } try { await api(`/v1/aims/${to}/references`, { body: { body_id: t.dataset.ref } }); toast("那棵树之后每一轮都会读到它"); S.forest = null; renderNode(); } catch (err) { toast(err.message); } return; }
  if (t.dataset.unref) { try { await api(`/v1/aims/${S.aim}/references/${t.dataset.unref}`, { method: "DELETE" }); toast("不再参考"); await refresh(); } catch (err) { toast(err.message); } return; }
  if (t.dataset.focus !== undefined) {
    try { await api(`/v1/aims/${S.aim}/tree/focus`, { body: { node_id: t.dataset.focus || null } }); toast(t.dataset.focus ? "之后 PGA 会沿这条分支想" : "已取消"); await loadTree(true); drawTree(false); renderNode(); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.id === "send") { send(); return; }
  if (t.id === "waitBtn") { showWaiting(); return; }
  if (t.id === "setBtn") { showSettings(); return; }
  if (t.id === "saveSettings") { saveSettings(); return; }
  if (t.dataset.closemodal) { document.querySelector(".modal")?.remove(); return; }
  if (t.dataset.answer || t.dataset.drop) {
    const id = t.dataset.answer || t.dataset.drop, text = t.dataset.answer ? (document.querySelector(`textarea[data-q="${CSS.escape(id)}"]`)?.value || "").trim() : "";
    if (t.dataset.answer && !text) { toast("先写下你的回答"); return; }
    try { await api(`/v1/aims/${S.aim}/perpetual/answer`, { body: t.dataset.answer ? { note_id: id, text } : { note_id: id, drop: true } });
      toast(t.dataset.answer ? "已回答：之后的每一轮都会读到" : "已放下这个问题"); await loadTree(true); if ((S.proc?.for_you || []).length || S.proc?.checkpoint) showWaiting(); else document.querySelector(".modal")?.remove(); }

      toast({ continue: "已同意，继续", adjust: "已按你的意见调整", stop: "已停下" }[t.dataset.cp]); S.cpApprove = null; document.querySelector(".modal")?.remove(); await loadTree(true); }
    catch (err) { toast(err.message); }

  }

  if (t.id === "rewrite") { try { await api(YOU() ? `/v1/users/${S.uid}/tree/rewrite` : `/v1/aims/${S.aim}/tree/rewrite`, { method: "POST" }); toast("整理者在后台重写这些概括，写好的会陆续更新"); } catch (err) { toast(err.message); } return; }

  }

document.addEventListener("input", (e) => { if (e.target.id === "search") { S.search = e.target.value; const pos = e.target.selectionStart; renderNode(); const s = $("#search"); s.focus(); s.setSelectionRange(pos, pos); } });
document.addEventListener("change", (e) => {

document.addEventListener("keydown", (e) => {
  if (e.target.id === "tnText" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); return; }
