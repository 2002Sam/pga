<script>/* the loading splash: only on the app page itself (not in a stage window), gone once boot() has drawn the first view */
(function () { const b = document.getElementById("boot"), t0 = performance.now(); let done = false;
  let embed = false; try { embed = new URLSearchParams(location.search).has("embed") || window.self !== window.top; } catch { embed = true; }
  if (embed) { b.remove(); window.pgaBootDone = () => {}; return; }
  const cat = b.querySelector('.boot-cat');
  cat.addEventListener('error', () => { cat.src = '/icons/logo-128.png?v=witch-cat-orange-1'; cat.classList.add('fallback'); }, { once: true });
  cat.src = cat.dataset.src;   // embedded conversation windows never request the splash artwork
  b.querySelector('.boot-caption').textContent = window.PGAShell?.L('正在打开工作台', 'Opening your workspace') || '正在打开工作台';
  window.pgaBootDone = () => { if (done) return; done = true;
    setTimeout(() => { b.classList.add("out"); setTimeout(() => b.remove(), 520); }, Math.max(0, 1600 - (performance.now() - t0))); };
  setTimeout(window.pgaBootDone, 10000);   // never stuck behind it
})();</script>
