<style>
:root {
  --bg: #09090b; --panel: #0f0f12; --raised: #16161a; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12); --line-3: rgba(255,255,255,.2);
  --text: #ececef; --muted: #a1a1aa; --dim: #71717a; --accent: #d6a75c; --accent-soft: rgba(214,167,92,.12); --blue: #8fb4ff; --green: #7fcf9f; --bad: #e58c7e;
  --rail: #0c0c0f; --canvas: #0a0a0c; --inset: #0c0c0f; --pop: #17171b; --hover: #1c1c21; --onprimary: #0b0b0e; --soft: rgba(255,255,255,.05);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
}
[data-theme=light] { --bg: #f6f6f7; --panel: #ffffff; --raised: #f1f1f3; --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.13); --line-3: rgba(0,0,0,.24);
  --text: #18181b; --muted: #52525b; --dim: #8a8a93; --accent: #a8741f; --accent-soft: rgba(168,116,31,.10); --blue: #2563c9; --green: #1f8a4c; --bad: #c2412d;
  --rail: #f0f0f2; --canvas: #fbfbfc; --inset: #f4f4f6; --pop: #ffffff; --hover: #ebebee; --onprimary: #ffffff; --soft: rgba(0,0,0,.045); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; letter-spacing: -.003em; }
a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; } button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
button:hover { border-color: var(--line-3); background: var(--hover); } button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--text); color: var(--onprimary); border-color: transparent; } button.primary:hover { background: var(--text); opacity: .88; }
button.accent { background: var(--accent-soft); color: var(--accent); border-color: rgba(214,167,92,.3); } button.accent:hover { background: rgba(214,167,92,.18); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); } button.ghost:hover { color: var(--text); background: var(--soft); }
button.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; } button.danger:hover { color: var(--bad); border-color: rgba(229,140,126,.4); }
select, input[type=text], input[type=number] { background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; height: 30px; padding: 0 8px; outline: none; font-size: 13px; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.num { font-variant-numeric: tabular-nums; } .muted { color: var(--muted); } .dimt { color: var(--dim); }

/* the frame: the bars on the left, one view on the right */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; }
.rail { display: flex; flex-direction: column; min-height: 0; background: var(--rail); border-right: 1px solid var(--line); }
.rail .brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; font-weight: 600; letter-spacing: .02em; color: var(--text); }
.rail .brand img { width: 18px; height: 18px; opacity: .9; } .rail .brand:hover { text-decoration: none; }
.rail .brand .pulse { margin-left: auto; font-size: 11.5px; font-weight: 400; color: var(--dim); letter-spacing: 0; display: flex; align-items: center; gap: 6px; }
.rail .grp { padding: 10px 18px 6px; display: flex; align-items: center; } .rail .grp .label { flex: 1; }
.rail .grp button { height: 22px; width: 22px; padding: 0; border-radius: 6px; font-size: 15px; line-height: 1; }
.bars { overflow: auto; flex: 1; padding: 0 8px 8px; min-height: 0; }
.rb { display: block; position: relative; padding: 9px 10px 10px; border-radius: 9px; cursor: pointer; color: var(--muted); margin-bottom: 2px; user-select: none; }
.rb:hover { background: var(--soft); color: var(--text); text-decoration: none; } .rb.on { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.rb .rt { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; } .rb .rt span.n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rb .rt small { font-size: 11px; color: var(--dim); font-weight: 400; font-variant-numeric: tabular-nums; }
.rb .badge { min-width: 16px; height: 16px; padding: 0 5px; border-radius: 8px; background: var(--accent); color: var(--onprimary); font-size: 10.5px; display: grid; place-items: center; font-weight: 600; }
.rb .line { display: block; height: 2px; margin-top: 7px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.rb .line i { display: block; height: 100%; border-radius: 2px; background: var(--dim); } .rb.run .line i { background: var(--accent); } .rb.mine .line i { background: var(--green); } .rb.chat .line i { background: var(--blue); }
.rb .rs { display: block; font-size: 11.5px; color: var(--dim); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3f3f46; flex: none; } .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(127,207,159,.15); }
.rail .foot { border-top: 1px solid var(--line); padding: 8px; display: grid; gap: 2px; }
.rail .foot a, .rail .foot .shell > button { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 500; border: 0; background: transparent; justify-content: flex-start; }
.rail .foot a:hover, .rail .foot .shell > button:hover { background: var(--soft); color: var(--text); text-decoration: none; } .rail .foot a.on { color: var(--text); background: var(--raised); }
.rail .foot svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }
.rail .foot .shell > button::before { content: ""; width: 16px; height: 16px; flex: none; background: currentColor;

          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='3'/><path d='M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'/></svg>") center / contain no-repeat; }
.rail .foot .shell { display: block; } .rail .shell-pop { top: auto; bottom: 40px; left: 0; right: auto; }
.plantbox { margin: 4px 8px 8px; padding: 10px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line-2); }
.plantbox textarea { width: 100%; min-height: 72px; resize: vertical; background: var(--inset); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 9px; outline: none; font-size: 13px; }
.plantbox .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.rail .brand .fold { margin-left: 6px; width: 24px; height: 24px; padding: 0; border-radius: 6px; font-size: 13px; color: var(--dim); }
.app { transition: grid-template-columns .2s ease; } .app.mini { grid-template-columns: 58px minmax(0, 1fr); }
.app.mini .rail .brand { flex-direction: column; padding: 14px 0 8px; gap: 10px; } .app.mini .rail .brand .t, .app.mini .rail .brand .pulse { display: none; }
.app.mini .rail .brand .fold { margin: 0; }
.app.mini .grp { display: none; } .app.mini .bars { padding: 4px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-top: 1px solid var(--line); }
.app.mini .rb .n, .app.mini .rb .rs, .app.mini .rb .line, .app.mini .rb .badge, .app.mini .rb .rt > .dot, .app.mini .plantbox { display: none; }
.app.mini .rb, .app.mini .rb.on, .app.mini .rb:hover { width: 40px; height: 40px; padding: 0; margin: 0; display: grid; place-items: center; background: transparent; box-shadow: none; border-radius: 10px; }
.app.mini .rb .rt { display: block; } .app.mini .rb .rt::before { content: attr(data-ini); width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--soft); color: var(--muted); font-size: 13px; font-weight: 600; transition: background .15s, color .15s; }
.app.mini .rb:hover .rt::before { color: var(--text); background: var(--raised); } .app.mini .rb.on .rt::before { background: var(--text); color: var(--onprimary); }
.app.mini .rb.run .rt::before { box-shadow: inset 0 0 0 1.5px var(--accent); } .app.mini .rb.mine .rt::before { box-shadow: inset 0 0 0 1.5px rgba(127,207,159,.6); }
.app.mini .rb.chat .rt::before { box-shadow: inset 0 0 0 1.5px rgba(143,180,255,.55); }
.app.mini .rail .foot { justify-items: center; } .app.mini .rail .foot a, .app.mini .rail .foot .shell > button { width: 40px; justify-content: center; padding: 0; font-size: 0; gap: 0; }
.app.mini .rail .foot span:not(.shell) { display: none; } .app.mini .rail .foot .shell { display: block; width: 40px; } .app.mini .rail .foot .shell > button::before { margin: 0; }
.dragtip { position: fixed; z-index: 61; pointer-events: none; padding: 4px 9px; border-radius: 7px; background: var(--pop); border: 1px solid var(--line-2); font-size: 12px; color: var(--text); white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.ci2 { position: relative; } .ci2 .arch { position: absolute; right: 10px; bottom: 8px; display: none; height: 22px; font-size: 11.5px; padding: 0 8px; } .ci2:hover .arch { display: block; }
.view { min-width: 0; min-height: 0; height: 100%; } .view[hidden] { display: none !important; }

/* a tree: the tree on one side, its dialogue taking most of the room */
#vTree { display: grid; grid-template-columns: minmax(300px, 36%) minmax(0, 1fr); }
#treeSide { position: relative; overflow: auto; border-right: 1px solid var(--line); background: radial-gradient(ellipse at 50% 100%, rgba(214,167,92,.06), transparent 60%), var(--canvas); min-width: 0; }
#treeSide svg { display: block; margin: 0 auto; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; font-size: 12px; color: var(--muted); background: linear-gradient(var(--canvas) 70%, transparent); }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); }
.seg button { height: 24px; border: 0; background: transparent; color: var(--muted); padding: 0 10px; font-size: 12px; border-radius: 6px; } .seg button.on { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.keys { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; } .keys i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--muted); margin-right: 5px; vertical-align: 0; }
.bar .act { color: var(--accent); cursor: pointer; } .bar .act:hover { text-decoration: underline; } .bar label { cursor: pointer; }
.hint { position: sticky; bottom: 0; padding: 8px 14px; font-size: 11.5px; color: var(--dim); background: linear-gradient(transparent, var(--canvas) 45%); pointer-events: none; }
#dialog { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; overflow: hidden; background: var(--panel); }
.dh { padding: 7px 14px 7px 20px; border-bottom: 1px solid var(--line); min-width: 0; }
.dh1 { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.dh1 .tname { font-size: 12.5px; color: var(--dim); flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dh2 { display: flex; align-items: center; gap: 8px; min-width: 0; } .dh2 h1 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.015em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dh2 input { width: 150px; height: 26px; font-size: 12px; } .dh2 .pill { height: 24px; font-size: 11.5px; padding: 0 9px; }
.kind { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; }
.pill b { color: var(--text); font-weight: 500; }
.meter { width: 44px; height: 3px; background: var(--line-2); border-radius: 2px; } .meter i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.dlg { overflow: auto; padding: 18px 28px 36px; min-width: 0; } .dlg > .inner { max-width: 880px; margin: 0 auto; }
.chainhead { font-size: 12px; color: var(--dim); margin: 0 0 4px; }
.seam { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 12.5px; scroll-margin-top: 8px; }
.seam:first-of-type { margin-top: 8px; } .seam .sn { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--raised); color: var(--muted); border: 1px solid var(--line-2); flex: none; }
.seam .st { color: var(--text); font-weight: 600; } .seam .sm { color: var(--dim); font-size: 12px; } .seam a.sm { color: var(--blue); }
.seam.cur { border-top-color: var(--accent); } .seam.cur .sn { background: var(--accent); color: var(--onprimary); border-color: var(--accent); }
.seamwhy { font-size: 12.5px; color: var(--muted); margin: -4px 0 12px 30px; }
.fork-end { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 24px 0 8px; padding-top: 14px; border-top: 1px dashed var(--line-3); font-size: 12.5px; color: var(--muted); }
.trnote { font-size: 12px; color: var(--dim); margin-bottom: 12px; }
.cont { border-top: 1px solid var(--line); padding: 8px 18px 10px; background: var(--inset); } .cont > .inner { max-width: 880px; margin: 0 auto; }
.cbar { display: flex; gap: 8px; align-items: flex-end; } .cbar select { height: 36px; max-width: 110px; } .cbar button.primary { height: 36px; }
.cont textarea, .ccomp textarea { flex: 1; width: 100%; height: 36px; min-height: 36px; max-height: 240px; resize: none; padding: 7px 12px !important; background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; outline: none; line-height: 1.6; }
.cont textarea:focus, .ccomp textarea:focus { border-color: var(--line-3); } .row2 { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; } .grow { flex: 1; }
.refs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 12px; color: var(--dim); } .refs:empty { display: none; }
.kpick { width: 36px; height: 36px; padding: 0; font-size: 16px; color: var(--muted); flex: none; } .refs select { height: 24px; font-size: 12px; max-width: 200px; }
.budbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; padding: 7px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--text); font-size: 12.5px; }
.budbar span { flex: 1; } .budbar a { color: var(--muted); }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; font-size: 12px; color: var(--muted); cursor: pointer; font-weight: 400; }
.chip:hover { color: var(--text); border-color: var(--line-3); background: transparent; } .chip.on { color: var(--text); border-color: var(--text); } .chip.user { color: var(--green); border-color: rgba(127,207,159,.35); } .chip.exchange { color: var(--blue); border-color: rgba(143,180,255,.35); }

/* everything else about a node lives in a drawer that stays out of the way */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 92%); z-index: 8; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; background: var(--panel);
  border-left: 1px solid var(--line-2); box-shadow: -24px 0 60px rgba(0,0,0,.28); transform: translateX(102%); transition: transform .22s ease; }
.drawer.on { transform: none; } .drawer > * { min-width: 0; }
.nh { padding: 14px 20px 12px; border-bottom: 1px solid var(--line); }
.nh .top { display: flex; align-items: center; gap: 8px; } .nh .top .crumb { flex: 1; }
.crumb { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .crumb a { color: var(--dim); } .crumb a:hover { color: var(--text); text-decoration: none; }
.nh .t { display: flex; gap: 12px; align-items: baseline; margin: 6px 0 2px; } .nh h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.015em; line-height: 1.4; flex: 1; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.navr { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.form { margin-top: 12px; padding: 12px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--raised); display: grid; gap: 8px; }
.form input[type=text], .form textarea, .form select { width: 100%; background: var(--inset); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; height: auto; }
.form textarea { min-height: 96px; resize: vertical; outline: none; } .form .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { height: 38px; border: 0; border-radius: 0; background: transparent; border-bottom: 2px solid transparent; color: var(--muted); padding: 0 9px; font-weight: 500; }
.tabs button:hover { color: var(--text); background: transparent; } .tabs button.on { color: var(--text); border-bottom-color: var(--text); } .tabs small { color: var(--dim); margin-left: 5px; font-weight: 400; font-variant-numeric: tabular-nums; }
.body { overflow: auto; padding: 18px 20px 36px; }
.sec { margin: 24px 0 10px; } .sec:first-child { margin-top: 0; }
.metarow { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--dim); margin-bottom: 14px; }
.shift { margin: 0 0 16px; padding: 10px 14px; border-left: 2px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--text); font-size: 13.5px; line-height: 1.7; }
.points { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; } .points li { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.015); font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stats div { background: var(--panel); padding: 10px 12px; } .stats b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; } .stats span { font-size: 11.5px; color: var(--dim); }

#tlSvg { display: block; } #tlSvg text { font: 500 12.5px/1 var(--font); fill: var(--text); cursor: pointer; } #tlSvg text .tm { font: 400 10.5px var(--font); fill: var(--dim); }

#tlSvg .tlseg.on, #tlSvg .tlarc.on { opacity: 1; stroke-width: 2.4; }

<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><a id="home" href="/" style="display:contents;color:inherit"><img src="/icons/favicon-32.png?v=3" alt=""><span class="t">PGA</span></a><span class="pulse" id="pulse"></span><button class="ghost fold" id="fold" title="收起 / 展开">«</button></div>
    <div class="bars" id="bars"></div>
    <div class="foot">
      <a href="#" id="toLib" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg><span data-l="模型与知识库|Models and library">模型与知识库</span></a>
      <a href="/agents" id="toAgents"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="9" r="3"/><path d="M2.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M12 19c.6-2.5 2.6-4.5 5-4.5s4.4 2 5 4.5"/></svg><span data-l="Agent 与连接|Agents and connections">Agent 与连接</span></a>
      <span id="shell"></span>

    </section>
  </main>

  <main class="view" id="vChats" hidden>
    <section class="clist" id="clist"></section>
    <section class="cpane"><div class="dh2" id="chead"></div><div class="dlg" id="cdlg"><div class="inner" id="cdlgIn"></div></div><div class="ccomp" id="ccomp"></div></section>

</div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = PGATree.esc;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const Q = new URLSearchParams(location.search), AS_UID = Q.get("as");
const LANG = Q.get("lang") || store.get("pga_lang") || "zh", EN = LANG === "en";
PGATree.setLang(LANG); document.documentElement.lang = EN ? "en" : "zh-CN";
const L = (zh, en) => (EN ? en : zh);
const S = { uid: AS_UID || store.get("pga_uid"), view: Q.get("view") || (Q.get("tree") ? "tree" : "home"), aim: Q.get("tree"), node: Q.get("node"),
  mode: store.get("pga_tree_mode") || "thought", dir: store.get("pga_tree_dir") || "down", beh: {}, contRefs: [], bud: null, tree: null, detail: {}, tab: store.get("pga_drawer_tab") || "overview",
  drawer: false, search: "", seen: new Set(), agents: [], sending: false, op: null, showHidden: false, forest: null, draft: "", proc: null, live: [],
  chats: null, chat: Q.get("c"), chatTurns: {}, chatDraft: "", chatRefs: [], chatAgent: store.get("pga_chat_agent") || "auto", planting: false };
const YOU = () => S.aim === "you";
const lq = (q) => (EN ? (q.includes("?") ? "&" : "?") + "lang=en" : "");
const treeApi = () => { const p = YOU() ? `/v1/users/${S.uid}/tree` : `/v1/aims/${S.aim}/tree`; return p + lq(p); };
const when = (iso) => iso ? new Date(iso).toLocaleString(EN ? "en-GB" : "zh-CN", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const ago = (iso) => { if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? L("刚刚", "just now") : s < 3600 ? L(`${Math.floor(s / 60)} 分钟前`, `${Math.floor(s / 60)}m ago`) : s < 86400 ? L(`${Math.floor(s / 3600)} 小时前`, `${Math.floor(s / 3600)}h ago`) : L(`${Math.floor(s / 86400)} 天前`, `${Math.floor(s / 86400)}d ago`); };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3400); }
async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || (opts.body ? "POST" : "GET"), headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error((data && (data.detail?.toString?.() || data.error)) || res.statusText);
  return data;
}
const md = (t) => (window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t || "").replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>"), { breaks: true, gfm: true })) : esc(t));
const asq = AS_UID ? `?as=${encodeURIComponent(AS_UID)}` : "";
const qs = () => {
  const q = new URLSearchParams();
  if (S.view === "tree" && S.aim) { q.set("tree", S.aim); if (S.node) q.set("node", S.node); }
  if (S.view === "chats") { q.set("view", "chats"); if (S.chat) q.set("c", S.chat); }
  if (AS_UID) q.set("as", AS_UID); if (Q.get("lang")) q.set("lang", Q.get("lang"));
  const s = q.toString(); return s ? "?" + s : location.pathname;
};
document.querySelectorAll("[data-l]").forEach((el) => { const [zh, en] = el.dataset.l.split("|"); el.textContent = L(zh, en); });
PGAShell.mount($("#shell")); $("#toAgents").href = "/agents" + asq; $("#home").href = "/" + asq;

/* ------------------------------------------------ the bars on the left */
function renderRail() {
  const F = S.forest || { trees: [] }, working = (S.live || []).filter((r) => r.running).length;
  $("#pulse").innerHTML = `<span class="dot ${working ? "on" : ""}"></span>${working ? L(`${working} 在工作`, `${working} working`) : ""}`;
  const maxN = Math.max(8, ...F.trees.map((t) => (t.nodes || []).length), (F.you?.nodes || []).length);
  const width = (n) => `${Math.max(4, Math.round(100 * Math.min(1, n / maxN)))}%`;
  const chats = S.chats || [];
  const bar = (id, name, sub, cls, fill, extra = "", ini = "") => `<a class="rb ${cls} ${(S.view === "tree" && S.aim === id) || (id === "chats" && S.view === "chats") ? "on" : ""}" href="${id === "chats" ? "?view=chats" : "?tree=" + id}" data-bar="${id}">
      <span class="rt" data-ini="${esc(ini || [...String(name)][0] || "·")}" title="${esc(name)}">${extra}<span class="n">${esc(name)}</span></span><span class="line"><i style="width:${fill}"></i></span>${sub ? `<span class="rs">${sub}</span>` : ""}</a>`;
  let html = `<div class="grp"><span class="label">${L("对话", "Conversations")}</span></div>`
    + bar("chats", L("时间树 · 日常对话", "Time tree · everyday chats"), chats.length ? L(`${chats.length} 段 · 最近 ${ago(chats[0].last_at)}`, `${chats.length} · latest ${ago(chats[0].last_at)}`) : L("一次性的提问，不用长成树", "One-off questions, no tree needed"), "chat", chats.length ? width(Math.min(maxN, chats.length)) : "4%", "", L("日", "D"))
    + (F.you ? bar("you", L("你的对话树", "Your conversation tree"), L(`${(F.you.nodes || []).length} 个节点`, `${(F.you.nodes || []).length} nodes`) + (F.you.pending ? L(` · ${F.you.pending} 轮待整理`, ` · ${F.you.pending} to place`) : ""), "mine", width((F.you.nodes || []).length), "", L("你", "Y")) : "")
    + `<div class="grp"><span class="label">${L("抱负 · 每一棵树", "Motivations · the trees")}</span><button class="ghost" id="plant" title="${L("新的抱负", "New motivation")}">+</button></div>`
    + (S.planting ? `<div class="plantbox"><textarea id="seedText" placeholder="${L("一个长期的抱负：你想让 PGA 一直朝什么方向努力？", "A long-range motivation: what should PGA keep working towards?")}"></textarea>
        <div class="row"><button class="sm ghost" id="seedCancel">${L("取消", "Cancel")}</button><button class="sm primary" id="seedGo">${L("种下", "Plant")}</button></div></div>` : "")
    + F.trees.map((t) => {
      const on = t.task?.status === "running", n = (t.nodes || []).filter((x) => x.kind !== "bud").length;
      const sub = [t.task ? (on ? L("生长中", "growing") : L("已暂停", "paused")) : L("还没开始", "not started"), L(`${n} 个节点`, `${n} nodes`), t.task ? L(`张力 ${t.task.pressure.toFixed(2)}`, `pressure ${t.task.pressure.toFixed(2)}`) : ""].filter(Boolean).join(" · ");
      return bar(t.id, t.text, sub, on ? "run" : "", width(n), `<span class="dot ${on ? "on" : ""}"></span>`).replace('<span class="n">', `${t.for_you ? `<span class="badge" title="${L("等你回答", "waiting for you")}">${t.for_you}</span>` : ""}<span class="n">`);
    }).join("");
  $("#bars").innerHTML = html;
  $("#toLib").classList.toggle("on", S.view === "home");
}
async function loadForest() {
  S.forest = await api(`/v1/users/${S.uid}/forest${EN ? "?lang=en" : ""}`);
  try { S.live = await api(`/v1/agents/live`); } catch { S.live = []; }
  if (!document.activeElement?.matches?.("#seedText")) renderRail();
  if (S.view === "home") renderHome();
}
async function loadChats() { try { S.allChats = await api(`/v1/users/${S.uid}/chats?archived=true&limit=300`); S.chats = S.allChats.filter((c) => !c.archived); } catch { S.chats = S.chats || []; } renderRail(); if (S.view === "chats") renderChatList(); }

function show(view, opts = {}) {
  S.view = view; closeCtx();
  ["Home", "Tree", "Chats"].forEach((v) => { $("#v" + v).hidden = v.toLowerCase() !== view; });
  if (view === "tree" && opts.aim !== undefined && opts.aim !== S.aim) { S.aim = opts.aim; S.node = opts.node || null; S.bud = null; S.detail = {}; S.beh = {}; S.seen = new Set(); S.tree = null; S.drawer = false; S.op = null; }
  history.replaceState(null, "", qs()); renderRail();
  if (view === "home") { document.title = "PGA"; renderHome(); }
  if (view === "tree") { $("#dlgIn").innerHTML = `<div class="empty">…</div>`; loadTree(); }
  if (view === "chats") { document.title = L("时间树 · PGA", "Time tree · PGA"); S.tlScrolled = false; renderTimeline(); loadTimeline(); renderChat(); if (S.chat) { S.tlSel = S.chat; loadChat(S.chat); } }
}

/* ------------------------------------------------ home: the two models and the library */
const DIMS = [["background", "背景", "Background"], ["goals", "目标", "Goals"], ["preferences", "偏好", "Preferences"], ["abilities", "能力", "Knowledge & skills"], ["state", "状态", "Current state"]];

/* the English pages: the dialogue is written in Chinese — each piece is translated once (and kept by the server) */
async function translateTurns(id) {
  const d = S.detail[id]; if (!d?.notes || d._tr) return; d._tr = "running";
  const cjk = /[㐀-鿿]/, jobs = [];
  for (const x of d.notes) {
    const dd = x.data || {};
    const add = (get, set) => { const t = get(); if (t && cjk.test(t)) jobs.push([t, set]); };
    add(() => x.text, (v) => { x.text = v; });
    add(() => dd.why, (v) => { dd.why = v; }); add(() => dd.question, (v) => { dd.question = v; }); add(() => dd.assumption, (v) => { dd.assumption = v; });
    for (const s of dd.samples || []) add(() => s.answer, (v) => { s.answer = v; });
    for (const s of dd.ideas || []) add(() => s.idea, (v) => { s.idea = v; });
    (dd.agreed || []).forEach((a, i) => add(() => a, (v) => { dd.agreed[i] = v; }));
  }
  d._trTotal = jobs.length; d._trDone = 0;
  for (let i = 0; i < jobs.length; i += 20) {
    const part = jobs.slice(i, i + 20);
    try { const r = await api(`/v1/users/${S.uid}/i18n`, { body: { texts: part.map(([t]) => t), lang: "en" } }); r.texts.forEach((v, k) => v && part[k][1](v)); } catch { break; }
    d._trDone = Math.min(jobs.length, i + 20);
    renderDialog(); if (S.drawer) renderBody();
  }
  d._tr = "done"; renderDialog(); if (S.drawer) renderBody();
}

/* the dialogue as one conversation: from the root down to this node, and on while it does not fork */
function chainOf(id) {
  const all = (S.tree?.nodes || []).filter((n) => n.kind !== "bud"), by = new Map(all.map((n) => [n.id, n]));
  const kidsOf = (x) => all.filter((k) => k.parent === x.id && (S.showHidden || !k.hidden)).sort((a, b) => a.seq - b.seq);
  const up = []; for (let x = by.get(id), i = 0; x && i < 400; x = by.get(x.parent), i++) up.unshift(x);
  const down = []; let cur = by.get(id);
  for (let i = 0; cur && i < 400; i++) { const k = kidsOf(cur); if (k.length !== 1) break; cur = k[0]; down.push(cur); }
  return { nodes: [...up, ...down], fork: cur ? kidsOf(cur) : [] };
}
function loadChain() {
  const { nodes } = chainOf(S.node), todo = nodes.filter((n) => !S.detail[n.id] && !n._loading);
  let i = 0;
  const next = async () => {
    const n = todo[i++]; if (!n) return;
    n._loading = true;
    try { S.detail[n.id] = await api(`/v1/thought-nodes/${n.id}?full=true${EN ? "&lang=en" : ""}`); } catch (e) { S.detail[n.id] = { error: e.message }; }
    if (EN && n.id === S.node) translateTurns(n.id);
    renderDialog(); if (n.id === S.node) { scrollToSeam(); renderDrawer(); }
    return next();
  };
  for (let k = 0; k < 4; k++) next();
}

  const keep = wrap.dataset.node === n.id ? wrap.scrollTop : null;
  const q = S.search.trim().toLowerCase(), keepNote = (x) => !q || x.text.toLowerCase().includes(q) || String(x.data?.code || "").toLowerCase() === q;
  const { nodes, fork } = chainOf(n.id), missing = nodes.some((x) => !S.detail[x.id]);
  if (missing) setTimeout(loadChain, 0);

      ${x.shift && i > 0 ? `<div class="seamwhy">${esc(x.shift)}</div>` : ""}
      ${!dd ? `<div class="dimt" style="font-size:12.5px;padding:8px 0">${L("载入…", "Loading…")}</div>` : dd.error ? `<div class="dimt">${esc(dd.error)}</div>` : notes.length ? PGATree.chat(notes, { md, name }) : `<div class="dimt" style="font-size:12.5px;padding:6px 0 14px">${q ? L("这一段没有符合的。", "Nothing matches in this stretch.") : x.kind === "segment" ? L("这一段还没有对话。", "No dialogue in this stretch yet.") : L("这条分支还空着：在下面写点什么，它就开始长。", "This branch is still empty: write below and it starts to grow.")}</div>`}`;
  }).join("");

/* rows go by time; each line holds a lane while it keeps talking (next session within a day); when it comes back later
   it takes a free lane and a path is drawn from where it stopped */
function tlLayout() {
  const T = S.tl || { sessions: [] }, ss = T.sessions || [], rows = [], ROW = 40, DAY = 30;
  const nextOf = new Map(), byLine = new Map();
  ss.forEach((x, i) => { if (!byLine.has(x.line)) byLine.set(x.line, []); byLine.get(x.line).push(i); });
  for (const idx of byLine.values()) idx.forEach((i, k) => nextOf.set(i, idx[k + 1]));
  const held = new Map(), free = [], last = new Map(), segs = [], arcs = [], pts = [];
  let y = 18, lanes = 0, day = "";
  const take = () => { free.sort((a, b) => a - b); return free.length ? free.shift() : lanes++; };
  ss.forEach((x, i) => {
    const d = new Date(x.at), dk = d.toDateString();
    if (dk !== day) { day = dk; rows.push({ day: d, y: y + DAY / 2 }); y += DAY; }
    let lane = held.get(x.line);
    const prev = last.get(x.line);
    if (lane === undefined) { lane = take(); if (prev) arcs.push({ from: prev, line: x.line, toY: y + ROW / 2, toLane: lane }); }
    else if (prev) segs.push({ lane, y1: prev.y, y2: y + ROW / 2, line: x.line });
    const p = { i, lane, y: y + ROW / 2, s: x }; pts.push(p); last.set(x.line, p);
    const nx = nextOf.get(i);
    if (nx !== undefined && new Date(ss[nx].at) - new Date(x.end || x.at) < 24 * 3600e3) held.set(x.line, lane);
    else { held.delete(x.line); free.push(lane); }
    y += ROW;
  });
  return { rows, pts, segs, arcs, lanes: Math.max(1, lanes), H: y + 30 };
}

    try { const r = await api(`/v1/users/${S.uid}/hub/sync`, { method: "POST" }); toast(L("同步好了", "Synced") + (r?.new != null ? ` · ${r.new}` : "")); await loadTimeline(); showImport(); } catch (err) { toast(err.message); } return; }
  if (t.id === "tidyGo") { try { const r = await api(`/v1/users/${S.uid}/timeline/organize`, { body: { use_model: true } });
      toast(L(`先按标题合了 ${r.new_lines} 条线；模型在后台读剩下的`, `${r.new_lines} lines from matching titles; a model reads the rest in the background`)); document.querySelector(".modal")?.remove(); pollTidy(); await loadTimeline(); } catch (err) { toast(err.message); } return; }
  if (t.id === "joinGo") { const to = $("#joinTo")?.value; if (!to) { toast(L("选一条线", "Pick a line")); return; }
    try { await api(`/v1/users/${S.uid}/timeline/items`, { method: "PUT", body: { key: t.dataset.key, line: to } }); document.querySelector(".modal")?.remove(); toast(L("接上了", "Joined")); await loadTimeline(); } catch (err) { toast(err.message); } return; }
  if (t.id === "unhideAll") { for (const k of S.tl?.hidden || []) await api(`/v1/users/${S.uid}/chats/archive`, { body: { key: k, archived: false } }).catch(() => {}); document.querySelector(".modal")?.remove(); await loadTimeline(); return; }
  if (t.dataset.plus) { branchFrom(t.dataset.plus); return; }
  if (t.id === "unbranch") { S.branchFrom = null; renderCont(); return; }
  if (t.id === "archToggle") { S.showArch = !S.showArch; renderChatList(); return; }
  if (t.dataset.arch) {
    e.stopPropagation(); const key = t.dataset.arch, to = t.dataset.to === "1";
    try { await api(`/v1/users/${S.uid}/chats/archive`, { body: { key, archived: to } }); toast(to ? L("已归档：在列表底部的「已归档」里能找回", "Archived: find it under “archived” at the bottom of the list") : L("已放回对话列表", "Back in the list"));
      if (to && S.chat === key) { S.chat = null; history.replaceState(null, "", qs()); }
      await loadChats(); renderChat(); } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.chat) { S.chat = t.dataset.chat; history.replaceState(null, "", qs()); renderChatList(); renderChat(); loadChat(S.chat); return; }
  if (t.id === "newChat") { S.chat = null; S.imp = null; S.tlSel = null; renderTimeline(); S.chatDraft = ""; history.replaceState(null, "", qs()); renderChatList(); renderChat(); $("#chatText")?.focus(); return; }
  if (t.id === "chatSend") { chatSend(); return; }
  if (t.dataset.chrefdel) { S.chatRefs = S.chatRefs.filter((x) => x !== t.dataset.chrefdel); renderChat(); return; }
  if (t.id === "drawerBtn") { S.drawer = !S.drawer; if (!S.drawer) S.op = null; renderDrawer(); renderHead(); return; }
  if (t.id === "drawerClose") { S.drawer = false; S.op = null; renderDrawer(); renderHead(); return; }
  if (t.dataset.mode) { S.mode = t.dataset.mode; store.set("pga_tree_mode", S.mode); renderBar(); drawTree(false); return; }
  if (t.dataset.crefdel) { S.contRefs = S.contRefs.filter((x) => x !== t.dataset.crefdel); renderCont(); return; }
  if (t.dataset.tbud) { const [id, i] = t.dataset.tbud.split("|"); select(id, Number(i)); $("#tnText")?.focus(); return; }
  if (t.dataset.tnode) { select(t.dataset.tnode); return; }
  if (t.dataset.go) { select(t.dataset.go); return; }
  if (t.dataset.goaim) { if (t.dataset.goaim === S.aim) { select(t.dataset.gonode); return; } show("tree", { aim: t.dataset.goaim, node: t.dataset.gonode }); return; }
  if (t.dataset.tab) { if (t.dataset.tab === "turns") { S.drawer = false; renderDrawer(); renderHead(); return; } S.tab = t.dataset.tab; store.set("pga_drawer_tab", S.tab); renderDrawer(); return; }
  if (t.dataset.trnode) { translateTurns(t.dataset.trnode); return; }
  if (t.dataset.bud !== undefined) { S.bud = Number(t.dataset.bud); drawTree(false); renderAll(); renderCont(); $("#tnText")?.focus(); return; }
  if (t.dataset.refadd || t.dataset.unrefnode) {
    const n = nodeOf(S.node), add = $("#refAdd")?.value;
    const refs = t.dataset.unrefnode ? (n.refs || []).filter((x) => x !== t.dataset.unrefnode) : add ? [...(n.refs || []), add] : null;
    if (!refs) { toast(L("选一份知识", "Pick one")); return; }
    try { await api(`/v1/thought-nodes/${n.id}/refs`, { method: "PUT", body: { refs } }); toast(t.dataset.unrefnode ? L("不再参考", "Removed") : L("从这里继续时，agent 会读到它", "Agents will read it when continuing from here")); await refresh(n.id); } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.move) { const to = $("#moveTo")?.value; if (!to) { toast(L("选一个节点", "Pick a node")); return; }
    try { await api(`/v1/bodies/${t.dataset.move}/move`, { body: { node_id: to } }); toast(L("已移过去", "Moved")); await refresh(S.node); } catch (err) { toast(err.message); } return; }
  if (t.dataset.op !== undefined) {
    const op = t.dataset.op;
    if (["hide", "merge", "delete", "distill", "markdown"].includes(op)) { quickOp(op); return; }
    if (op === "branchhere") { branchFrom(S.node); return; }
    if (!op) { S.op = null; renderDrawer(); return; }
    openOp(op); return;
  }
  if (t.dataset.do) { doOp(t.dataset.do); return; }
  if (t.dataset.compile) { toast(L("整理中…", "Compiling…")); try { const r = await api(`/v1/bodies/${t.dataset.compile}/compile`, { method: "POST" }); toast(r.status === "compiled" ? L("整理好了", "Done") : r.note || r.status); document.querySelector(".modal")?.remove(); await loadForest(); } catch (err) { toast(err.message); } return; }
  if (t.dataset.doc !== undefined) { showDoc(t.dataset.doc); return; }
  if (t.dataset.ref) { const to = $("#refTo")?.value; if (!to) { toast(L("选一棵树", "Pick a tree")); return; } try { await api(`/v1/aims/${to}/references`, { body: { body_id: t.dataset.ref } }); toast(L("那棵树之后每一轮都会读到它", "That tree will read it every round")); S.forest = null; renderDrawer(); } catch (err) { toast(err.message); } return; }
  if (t.dataset.unref) { try { await api(`/v1/aims/${S.aim}/references/${t.dataset.unref}`, { method: "DELETE" }); toast(L("不再参考", "Removed")); await refresh(); } catch (err) { toast(err.message); } return; }
  if (t.dataset.focus !== undefined) { focusOn(t.dataset.focus); return; }
  if (t.id === "send") { send(); return; }
  if (t.id === "waitBtn") { showWaiting(); return; }
  if (t.id === "setBtn") { showSettings(); return; }
  if (t.id === "saveSettings") { saveSettings(); return; }
  if (t.dataset.closemodal) { document.querySelector(".modal")?.remove(); return; }
  if (t.dataset.answer || t.dataset.drop) {
    const id = t.dataset.answer || t.dataset.drop, text = t.dataset.answer ? (document.querySelector(`textarea[data-q="${CSS.escape(id)}"]`)?.value || "").trim() : "";
    if (t.dataset.answer && !text) { toast(L("先写下你的回答", "Write your answer first")); return; }
    try { await api(`/v1/aims/${S.aim}/perpetual/answer`, { body: t.dataset.answer ? { note_id: id, text } : { note_id: id, drop: true } });
      toast(t.dataset.answer ? L("已回答：之后的每一轮都会读到", "Answered: every later round reads it") : L("已放下这个问题", "Skipped")); await loadTree(true);
      if ((S.proc?.for_you || []).length || S.proc?.checkpoint) showWaiting(); else document.querySelector(".modal")?.remove(); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.cp) {
    const cp = S.proc?.checkpoint; if (!cp) return;
    const text = ($("#cpText")?.value || "").trim();
    if (t.dataset.cp === "adjust" && !text) { toast(L("先写下你的意见", "Write your view first")); $("#cpText")?.focus(); return; }
    if (t.dataset.cp === "stop" && !confirm(L("停下：这个抱负会暂停，直到你按开始。", "Stop: this motivation pauses until you press Start."))) return;
    const approve = [...document.querySelectorAll("[data-cpp]")].filter((x) => x.checked).map((x) => x.dataset.cpp);
    const option = Number(document.querySelector('input[name=cpopt]:checked')?.value ?? 0);
    try { await api(`/v1/aims/${S.aim}/perpetual/checkpoint`, { body: { note_id: cp.id, decision: t.dataset.cp, text, option, approve } });
      toast({ continue: L("已同意，继续", "Continuing"), adjust: L("已按你的意见调整", "Adjusted"), stop: L("已停下", "Stopped") }[t.dataset.cp]); document.querySelector(".modal")?.remove(); await loadTree(true); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.id === "curate") { try { const r = await api(YOU() ? `/v1/users/${S.uid}/tree/curate` : `/v1/aims/${S.aim}/tree/curate`, { method: "POST", body: {} }); toast(L(`开始整理 ${r.pending} 轮对话`, `Placing ${r.pending} turns`)); } catch (err) { toast(err.message); } return; }
  if (t.id === "rewrite") { try { await api(YOU() ? `/v1/users/${S.uid}/tree/rewrite` : `/v1/aims/${S.aim}/tree/rewrite`, { method: "POST" }); toast(L("整理者在后台重写这些概括", "The curator is rewriting them in the background")); } catch (err) { toast(err.message); } return; }
  if (t.id === "runBtn") {
    const T = S.tree, on = T.task?.status === "running"; if (!T.project) return;
    try { await api(`/v1/users/${S.uid}/projects/${T.project.id}/run`, { body: { action: on ? "pause" : "start" } }); toast(on ? L("已暂停", "Paused") : L("开始了", "Started")); await loadTree(true); loadForest().catch(() => {}); }
    catch (err) { toast(err.message); }
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "search") { S.search = e.target.value; renderDialog(); } if (e.target.id === "tnText" || e.target.id === "chatText") autoGrow(e.target); });
document.addEventListener("change", (e) => {
  if (e.target.id === "crefAdd" && e.target.value) { S.contRefs = [...S.contRefs, e.target.value]; renderCont(); return; }
  if (e.target.id === "chrefAdd" && e.target.value) { S.chatRefs = [...S.chatRefs, e.target.value]; renderChat(); return; }
  if (e.target.id === "chatAgent") { S.chatAgent = e.target.value; store.set("pga_chat_agent", S.chatAgent); return; }
  if (e.target.id === "showHidden") { S.showHidden = e.target.checked; drawTree(false); renderDialog(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "tnText" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); return; }
  if (e.target.id === "chatText" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); S.imp ? impSend() : chatSend(); return; }
  if (e.key === "Escape") { closeCtx(); document.querySelector(".modal")?.remove(); if (S.drawer) { S.drawer = false; S.op = null; renderDrawer(); renderHead(); } return; }
  if (e.target.closest?.("textarea, input, select") || S.view !== "tree") return;
  const list = S.layout?.list || [], i = list.findIndex((x) => x.id === S.node);
  if (e.key === "ArrowUp" && i < list.length - 1) { e.preventDefault(); select(list[i + 1].id); }
  if (e.key === "ArrowDown" && i > 0) { e.preventDefault(); select(list[i - 1].id); }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S.tree && S.view === "tree" && drawTree(false), 150); });
window.addEventListener("pga:theme", () => { if (S.tree && S.view === "tree") drawTree(false); });

/* ------------------------------------------------ the tree by hand: + for a new node, drag to move or link, swipe to cut */
const DR = {};
function setMini(on) {
  S.mini = on; store.set("pga_rail_mini", on ? "1" : "0");
  $(".app").classList.toggle("mini", on); $("#fold").textContent = on ? "»" : "«"; $("#fold").title = on ? L("展开", "Expand") : L("收起", "Collapse");
  setTimeout(() => { if (S.tree && S.view === "tree") drawTree(false); }, 230);
}
function branchFrom(id) {
  if (!nodeOf(id)) return;
  if (S.node !== id) select(id);
  S.branchFrom = id; S.bud = null; S.drawer = false; renderDrawer(); renderHead(); renderCont(); $("#tnText")?.focus();
}
const svgScale = () => { const r = $("#treeSvg").getBoundingClientRect(); return (S.layout?.W || r.width) / (r.width || 1); };
const nodeAt = (x, y, not) => { for (const el of document.elementsFromPoint(x, y)) { const g = el.closest?.("[data-tnode]"); if (g && g.dataset.tnode !== not) return g.dataset.tnode; } return null; };
$("#treeSvg").addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const g = e.target.closest(".tn");
  if (g) { Object.assign(DR, { node: g.dataset.tnode, x0: e.clientX, y0: e.clientY, moving: false }); return; }
});
document.addEventListener("pointermove", (e) => {
  if (DR.node) {
    if (!DR.moving && Math.hypot(e.clientX - DR.x0, e.clientY - DR.y0) < 6) return;
    DR.moving = true; closeCtx();
    const k = svgScale(), dx = (e.clientX - DR.x0) * k, dy = (e.clientY - DR.y0) * k, n = S.layout.by.get(DR.node); if (!n) return;
    document.querySelectorAll(`[data-tnode="${CSS.escape(DR.node)}"]`).forEach((el) => {
      if (el.classList.contains("tn")) { el.setAttribute("transform", `translate(${n.x + dx},${n.y + (S.layout.flip ? -dy : dy)})`); el.classList.add("drag"); }
      else if (el.tagName === "text") el.setAttribute("transform", `translate(${dx},${dy})`);
    });
    const over = nodeAt(e.clientX, e.clientY, DR.node);
    document.querySelectorAll(".tn.drop").forEach((x) => x.classList.remove("drop"));
    if (over) document.querySelector(`.tn[data-tnode="${CSS.escape(over)}"]`)?.classList.add("drop");
    DR.over = over;
    let tip = $(".dragtip"); if (!tip) { tip = document.createElement("div"); tip.className = "dragtip"; document.body.appendChild(tip); }
    tip.textContent = over ? L(`放开：链接到「${(nodeOf(over)?.title || "").slice(0, 16)}」`, `Release: link to “${(nodeOf(over)?.title || "").slice(0, 20)}”`) : L("放开：移到这里", "Release: move it here");
    tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 14 + "px";
  }
});
document.addEventListener("pointerup", async (e) => {
  if (DR.node) {
    const id = DR.node, moved = DR.moving, over = DR.over; DR.node = null; DR.moving = false; DR.over = null; $(".dragtip")?.remove();
    if (moved) {
      DR.suppress = true; setTimeout(() => { DR.suppress = false; }, 50);
      const n = nodeOf(id), k = svgScale(), dx = (e.clientX - DR.x0) * k, dy = (e.clientY - DR.y0) * k;
      try {
        if (over) { await api(`/v1/thought-nodes/${id}/links`, { body: { to: over } }); toast(L("已链接：从其中一个继续时，agent 会读到另一个", "Linked: continuing from one, agents read the other")); }
        else { const p = n?.pos || { dx: 0, dy: 0 }; await api(`/v1/thought-nodes/${id}`, { method: "PATCH", body: { pos: { dx: (p.dx || 0) + dx, dy: (p.dy || 0) + (S.layout.flip ? -dy : dy) } } }); }
      } catch (err) { toast(err.message); }
      await loadTree(true); drawTree(false);
    }
  }
});

async function boot() {
  setMini(store.get("pga_rail_mini") === "1");
  if (!S.uid) { try { S.uid = (await api("/healthz")).owner; } catch {} }
  await Promise.all([loadForest().catch(() => {}), loadChats(), api(`/v1/users/${S.uid}/console`).then((d) => { S.agents = (d.agents || []).filter((a) => a.enabled !== false && a.name !== "?"); }).catch(() => {})]);
  show(S.view === "tree" && !S.aim ? "home" : S.view);
  setInterval(() => { loadForest().catch(() => {}); if (S.view === "tree") loadTree(true).catch(() => {}); if (S.view === "chats" && !S.sending) { loadChats(); loadTimeline(); } }, 20000);
}
boot();
</script>
