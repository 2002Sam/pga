    setTimeout(() => { b.classList.add("out"); setTimeout(() => b.remove(), 520); }, Math.max(0, 1600 - (performance.now() - t0))); };
  setTimeout(window.pgaBootDone, 10000);   // never stuck behind it
})();</script>
