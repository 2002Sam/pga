<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree · PGA</title>
<link rel="icon" href="/icons/favicon-32.png?v=witch-cat-1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="/ui/shell.js"></script>
<script src="/ui/tree.js"></script>
<style>
:root {
  --bg: #09090b; --panel: #0f0f12; --raised: #16161a; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12); --line-3: rgba(255,255,255,.2);
  --text: #ececef; --muted: #a1a1aa; --dim: #71717a; --accent: #d6a75c; --accent-soft: rgba(214,167,92,.12); --blue: #8fb4ff; --green: #7fcf9f; --bad: #e58c7e;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; letter-spacing: -.003em; }
a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; } button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
button:hover { border-color: var(--line-3); background: var(--hover); } button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--text); color: var(--onprimary); border-color: transparent; } button.primary:hover { background: var(--text); opacity: .88; }
button.accent { background: var(--accent-soft); color: var(--accent); border-color: rgba(214,167,92,.3); } button.accent:hover { background: rgba(214,167,92,.18); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); } button.ghost:hover { color: var(--text); background: rgba(255,255,255,.05); }
button.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; } button.danger:hover { color: var(--bad); border-color: rgba(229,140,126,.4); }
select, input[type=text], input[type=number] { background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; height: 30px; padding: 0 8px; outline: none; font-size: 13px; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.num { font-variant-numeric: tabular-nums; } .muted { color: var(--muted); } .dimt { color: var(--dim); }
.app { display: grid; grid-template-rows: 52px minmax(0, 1fr); height: 100%; }
header { display: flex; align-items: center; gap: 16px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--hdr); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text); letter-spacing: .02em; } .brand img { width: 18px; height: 18px; opacity: .9; } .brand:hover { text-decoration: none; }
nav { display: flex; gap: 2px; align-items: center; } nav a { padding: 5px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; } nav a:hover { color: var(--text); text-decoration: none; } nav .sep { color: var(--dim); }
.pick { max-width: 300px; }
.run { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill b { color: var(--text); font-weight: 500; } .dot { width: 6px; height: 6px; border-radius: 50%; background: #3f3f46; } .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(127,207,159,.15); }
.meter { width: 48px; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; } .meter i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.lang { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; } .lang button { height: 26px; border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 0 9px; font-size: 12px; }
.lang button.on { background: rgba(255,255,255,.08); color: var(--text); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(440px, 46%); min-height: 0; }
#treeSide { position: relative; overflow: auto; border-right: 1px solid var(--line); background: radial-gradient(ellipse at 50% 100%, rgba(214,167,92,.06), transparent 60%), var(--canvas); }
#treeSide svg { display: block; margin: 0 auto; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; font-size: 12px; color: var(--muted);
  background: linear-gradient(var(--canvas) 70%, transparent); }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
.seg button { height: 24px; border: 0; background: transparent; color: var(--muted); padding: 0 10px; font-size: 12px; border-radius: 6px; } .seg button.on { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.keys { display: inline-flex; gap: 12px; align-items: center; } .keys i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--muted); margin-right: 5px; vertical-align: 0; }
.bar .act { color: var(--accent); cursor: pointer; } .bar .act:hover { text-decoration: underline; } .bar label { cursor: pointer; margin-left: auto; }
#nodeSide { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; overflow: hidden; background: var(--panel); }
#nodeSide > * { min-width: 0; } #treeSide { min-width: 0; }
.nh { padding: 16px 24px 12px; border-bottom: 1px solid var(--line); }
.crumb { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .crumb a { color: var(--dim); } .crumb a:hover { color: var(--text); text-decoration: none; }
.nh .t { display: flex; gap: 12px; align-items: baseline; margin: 6px 0 2px; } .nh h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.015em; line-height: 1.4; flex: 1; }
.kind { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 12px; } .tools .sp { flex: 1; }
.menu { position: relative; } .menu .pop { position: absolute; right: 0; top: 34px; z-index: 5; min-width: 200px; background: var(--pop); border: 1px solid var(--line-2); border-radius: 10px; padding: 5px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.menu .pop button { display: flex; width: 100%; justify-content: flex-start; background: transparent; border: 0; height: 30px; font-weight: 400; color: var(--text); }
.menu .pop button:hover { background: rgba(255,255,255,.06); } .menu .pop button.danger { color: var(--bad); } .menu .pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.navr { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; font-size: 12px; color: var(--muted); cursor: pointer; font-weight: 400; }
.chip:hover { color: var(--text); border-color: var(--line-3); background: transparent; } .chip.on { color: var(--text); border-color: var(--text); } .chip.user { color: var(--green); border-color: rgba(127,207,159,.35); } .chip.exchange { color: var(--blue); border-color: rgba(143,180,255,.35); }
.form { margin-top: 12px; padding: 12px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--raised); display: grid; gap: 8px; }
.form input[type=text], .form textarea, .form select { width: 100%; background: var(--inset); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; height: auto; }
.form textarea { min-height: 96px; resize: vertical; outline: none; } .form .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.tabs { display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.tabs button { height: 40px; border: 0; border-radius: 0; background: transparent; border-bottom: 2px solid transparent; color: var(--muted); padding: 0 10px; font-weight: 500; }
.tabs button:hover { color: var(--text); background: transparent; } .tabs button.on { color: var(--text); border-bottom-color: var(--text); } .tabs small { color: var(--dim); margin-left: 5px; font-weight: 400; font-variant-numeric: tabular-nums; }
.body { overflow: auto; padding: 20px 24px 36px; }
.sec { margin: 24px 0 10px; } .sec:first-child { margin-top: 0; }
.metarow { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--dim); margin-bottom: 14px; }
.shift { margin: 0 0 16px; padding: 10px 14px; border-left: 2px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--text); font-size: 13.5px; line-height: 1.7; }
.points { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; } .points li { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.015); font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stats div { background: var(--panel); padding: 10px 12px; } .stats b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; } .stats span { font-size: 11.5px; color: var(--dim); }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
.item .x { flex: 1; font-size: 13.5px; } .item .s { font-size: 12px; color: var(--dim); margin-top: 3px; } .item.dash { border-style: dashed; }
.filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; } .filters input { flex: 1; min-width: 140px; }
.kcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; } .kcard .kt { display: flex; gap: 10px; align-items: baseline; }
.kcard .kt b { font-weight: 600; flex: 1; font-size: 13.5px; } .kcard .kg { color: var(--muted); font-size: 13px; margin-top: 4px; } .kcard .ka { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.ty { font-size: 10.5px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); }
.commit, .file { display: flex; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; } .commit:first-child, .file:first-child { border-top: 0; }
.commit a, .file a { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; } .commit time { color: var(--dim); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; } .file span { color: var(--dim); margin-left: auto; }
.cont { border-top: 1px solid var(--line); padding: 12px 24px 14px; background: var(--inset); }
.cont textarea { width: 100%; min-height: 52px; max-height: 220px; resize: vertical; background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; outline: none; line-height: 1.6; }
.cont textarea:focus { border-color: var(--line-3); } .cont .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; } .cont .grow { flex: 1; }
.cont .refs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; color: var(--dim); } .cont .refs select { height: 24px; font-size: 12px; }
.trnote { font-size: 12px; color: var(--dim); margin-bottom: 12px; }
.chainhead { font-size: 12px; color: var(--dim); margin: -4px 0 6px; }
.seam { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 12.5px; scroll-margin-top: 8px; }
.seam:first-of-type { margin-top: 8px; } .seam .sn { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--raised); color: var(--muted); border: 1px solid var(--line-2); flex: none; }
.seam .st { color: var(--text); font-weight: 600; } .seam .sm { color: var(--dim); font-size: 12px; } .seam a.sm { color: var(--blue); }
.seam.cur { border-top-color: var(--accent); } .seam.cur .sn { background: var(--accent); color: var(--onprimary); border-color: var(--accent); }
.seamwhy { font-size: 12.5px; color: var(--muted); margin: -4px 0 12px 30px; }
.fork-end { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 24px 0 8px; padding-top: 14px; border-top: 1px dashed var(--line-3); font-size: 12.5px; color: var(--muted); }
.empty { padding: 40px 24px; color: var(--dim); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 30; }
.modal .box { width: min(780px, 92vw); max-height: 86vh; overflow: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; padding: 24px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.modal h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; } .md p { margin: .5em 0; line-height: 1.75; } .md h1, .md h2, .md h3 { font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; cursor: pointer; } .opt input { margin-top: 4px; } .opt .d { font-size: 12.5px; color: var(--dim); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--pop); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 14px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 40; }
#toast.on { opacity: 1; }
#enter { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: var(--bg); animation: enter .7s ease forwards; } @keyframes enter { to { opacity: 0; } }
@media (max-width: 960px) { body { overflow: auto; } .app { height: auto; } main { grid-template-columns: 1fr; } #treeSide { height: 60vh; border-right: 0; border-bottom: 1px solid var(--line); } #nodeSide { min-height: 70vh; } .run .pill.opt2 { display: none; } }

:root { --hdr: rgba(9,9,11,.85); --canvas: #0a0a0c; --inset: #0c0c0f; --pop: #17171b; --hover: #1c1c21; --onprimary: #0b0b0e; }
[data-theme=light] { --bg: #f6f6f7; --panel: #ffffff; --raised: #f1f1f3; --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.13); --line-3: rgba(0,0,0,.24);
  --text: #18181b; --muted: #52525b; --dim: #8a8a93; --accent: #a8741f; --accent-soft: rgba(168,116,31,.10); --blue: #2563c9; --green: #1f8a4c; --bad: #c2412d;
  --hdr: rgba(255,255,255,.88); --canvas: #fbfbfc; --inset: #f4f4f6; --pop: #ffffff; --hover: #ebebee; --onprimary: #ffffff; }
</style>
</head>
<body>
<div id="enter"></div>
<div class="app">
  <header>
    <a class="brand" id="home" href="/"><img src="/icons/logo-128.png?v=witch-cat-1" alt="PGA 魔女猫">PGA</a>
    <nav><a href="/" id="toForest" data-l="森林|Forest">森林</a><a href="/agents" id="toAgents">Agents</a><span class="sep">/</span></nav>
    <select class="pick" id="aimPick"></select>
    <div class="run" id="run"></div>
    <span id="shell"></span>
  </header>
  <main>
    <section id="treeSide" class="treewrap"><div class="bar" id="bar"></div><svg id="treeSvg"></svg></section>
    <section id="nodeSide">
      <div class="nh" id="nh"></div>
      <div class="tabs" id="tabs"></div>
      <div class="body" id="body"><div class="empty">…</div></div>
      <div class="cont" id="cont"></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = PGATree.esc;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const Q = new URLSearchParams(location.search), AS_UID = Q.get("as");
const LANG = Q.get("lang") || store.get("pga_lang") || "zh", EN = LANG === "en";
PGATree.setLang(LANG); document.documentElement.lang = EN ? "en" : "zh-CN";
const L = (zh, en) => (EN ? en : zh);
const S = { uid: AS_UID || store.get("pga_uid"), aim: Q.get("you") ? "you" : Q.get("aim"), node: Q.get("node"), mode: store.get("pga_tree_mode") || "thought", beh: {}, contRefs: [],
  bud: null, tree: null, detail: {}, tab: store.get("pga_tree_tab2") || "turns", filter: "all", search: "", seen: new Set(), agents: [], aims: [], sending: false, op: null,
  showHidden: false, forest: null, draft: "", proc: null, menu: false, tr: {} };
const YOU = () => S.aim === "you";
const lq = (q) => (EN ? (q.includes("?") ? "&" : "?") + "lang=en" : "");
const treeApi = () => { const p = YOU() ? `/v1/users/${S.uid}/tree` : `/v1/aims/${S.aim}/tree`; return p + lq(p); };
const when = (iso) => iso ? new Date(iso).toLocaleString(EN ? "en-GB" : "zh-CN", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const ago = (iso) => { if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? L("刚刚", "just now") : s < 3600 ? L(`${Math.floor(s / 60)} 分钟前`, `${Math.floor(s / 60)}m ago`) : s < 86400 ? L(`${Math.floor(s / 3600)} 小时前`, `${Math.floor(s / 3600)}h ago`) : L(`${Math.floor(s / 86400)} 天前`, `${Math.floor(s / 86400)}d ago`); };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3400); }
async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || (opts.body ? "POST" : "GET"), headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error((data && (data.detail?.toString?.() || data.error)) || res.statusText);
  return data;
}
const md = (t) => (window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t || "").replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>"))) : esc(t));
const qs = () => { const q = new URLSearchParams(); if (YOU()) q.set("you", "1"); else if (S.aim) q.set("aim", S.aim); if (S.node) q.set("node", S.node); if (AS_UID) q.set("as", AS_UID); if (Q.get("lang")) q.set("lang", Q.get("lang")); return "?" + q; };
const asq = AS_UID ? `?as=${encodeURIComponent(AS_UID)}` : "";
document.querySelectorAll("[data-l]").forEach((el) => { const [zh, en] = el.dataset.l.split("|"); el.textContent = L(zh, en); });
PGAShell.mount($("#shell")); $("#toAgents").href = "/agents" + asq;

/* ------------------------------------------------ loading */
async function boot() {
  if (!S.uid) { try { S.uid = (await api("/healthz")).owner; } catch {} }
  $("#toForest").href = $("#home").href = "/" + asq;
  try { const d = await api(`/v1/users/${S.uid}/forest${EN ? "?lang=en" : ""}`); S.forest = d; S.aims = (d.trees || []).map((t) => ({ id: t.id, text: t.text, task: t.task })); } catch {}
  try { const d = await api(`/v1/users/${S.uid}/console`); S.agents = (d.agents || []).filter((a) => a.enabled !== false && a.name !== "?"); } catch {}
  if (!S.aim) S.aim = (S.aims.find((a) => a.task) || S.aims[0])?.id || "you";
  $("#aimPick").innerHTML = `<option value="you" ${YOU() ? "selected" : ""}>${L("你的对话", "Your conversations")}</option>` + S.aims.map((a) => `<option value="${a.id}" ${a.id === S.aim ? "selected" : ""}>${esc(a.text.length > 34 ? a.text.slice(0, 33) + "…" : a.text)}</option>`).join("");
  await loadTree();
  setInterval(() => loadTree(true).catch(() => {}), 20000);
}
async function loadProc() {
  if (YOU()) { S.proc = null; return; }
  try { S.proc = await api(`/v1/users/${S.uid}/console/aims/${S.aim}`); } catch { S.proc = null; }
}
async function loadTree(quiet) {
  [S.tree] = await Promise.all([api(treeApi()), loadProc()]);
  document.title = `${S.tree.aim?.text?.slice(0, 30) || L("思考树", "Tree")} · PGA`;
  const nodes = (S.tree.nodes || []).filter((n) => n.kind !== "bud");
  if (!S.node || !nodes.some((n) => n.id === S.node)) S.node = (nodes.find((n) => n.tip) || nodes[nodes.length - 1])?.id || null;
  renderRun(); renderBar(); drawTree(!quiet);
  if (!quiet) { renderNode(); if (S.node) loadNode(S.node); if (S.tab === "turns") scrollToSeam(); }
}
async function loadNode(id, force) {
  if (S.detail[id] && !force) { renderNode(); return; }
  try { S.detail[id] = await api(`/v1/thought-nodes/${id}?full=true${EN ? "&lang=en" : ""}`); } catch (e) { S.detail[id] = { error: e.message }; }
  if (EN) translateTurns(id);
  if (S.node === id) renderNode();
}
async function forest() { if (!S.forest) S.forest = await api(`/v1/users/${S.uid}/forest${EN ? "?lang=en" : ""}`); return S.forest; }

/* the English pages: the dialogue is written in Chinese — each piece is translated once (and kept by the server) */
async function translateTurns(id) {
  const d = S.detail[id]; if (!d?.notes || d._tr) return; d._tr = "running";
  const cjk = /[㐀-鿿]/, jobs = [];
  for (const x of d.notes) {
    const dd = x.data || {};
    const add = (get, set) => { const t = get(); if (t && cjk.test(t)) jobs.push([t, set]); };
    add(() => x.text, (v) => { x.text = v; });
    add(() => dd.why, (v) => { dd.why = v; }); add(() => dd.question, (v) => { dd.question = v; }); add(() => dd.assumption, (v) => { dd.assumption = v; });
    for (const s of dd.samples || []) add(() => s.answer, (v) => { s.answer = v; });
    for (const s of dd.ideas || []) add(() => s.idea, (v) => { s.idea = v; });
    (dd.agreed || []).forEach((a, i) => add(() => a, (v) => { dd.agreed[i] = v; }));
  }
  d._trTotal = jobs.length; d._trDone = 0;
  for (let i = 0; i < jobs.length; i += 20) {
    const part = jobs.slice(i, i + 20);
    try { const r = await api(`/v1/users/${S.uid}/i18n`, { body: { texts: part.map(([t]) => t), lang: "en" } }); r.texts.forEach((v, k) => v && part[k][1](v)); } catch { break; }
    d._trDone = Math.min(jobs.length, i + 20);
    if (S.node === id && ["turns", "overview", "samples"].includes(S.tab)) renderBody();
  }
  d._tr = "done"; if (S.node === id) renderBody();
}

/* the dialogue as one conversation: from the root down to this node, and on while it does not fork */
function chainOf(id) {
  const all = (S.tree?.nodes || []).filter((n) => n.kind !== "bud"), by = new Map(all.map((n) => [n.id, n]));
  const kidsOf = (x) => all.filter((k) => k.parent === x.id && (S.showHidden || !k.hidden)).sort((a, b) => a.seq - b.seq);
  const up = []; for (let x = by.get(id), i = 0; x && i < 400; x = by.get(x.parent), i++) up.unshift(x);
  const down = []; let cur = by.get(id);
  for (let i = 0; cur && i < 400; i++) { const k = kidsOf(cur); if (k.length !== 1) break; cur = k[0]; down.push(cur); }
  return { nodes: [...up, ...down], fork: cur ? kidsOf(cur) : [] };
}
function loadChain() {
  const { nodes } = chainOf(S.node), todo = nodes.filter((n) => !S.detail[n.id] && !n._loading);
  let i = 0;
  const next = async () => {
    const n = todo[i++]; if (!n) return;
    n._loading = true;
    try { S.detail[n.id] = await api(`/v1/thought-nodes/${n.id}?full=true${EN ? "&lang=en" : ""}`); } catch (e) { S.detail[n.id] = { error: e.message }; }
    if (EN && n.id === S.node) translateTurns(n.id);
    if (S.tab === "turns") { renderBody(); if (n.id === S.node) scrollToSeam(); }
    return next();
  };
  for (let k = 0; k < 4; k++) next();
}

/* ------------------------------------------------ doing things */
async function refresh(id) { S.forest = null; if (id) delete S.detail[id]; await loadTree(true); renderNode(); if (S.node) loadNode(S.node, true); }
async function send() {
  const n = nodeOf(S.node), text = ($("#tnText")?.value || "").trim(); if (!n) return;
  if (!text) { toast(L("先写下你要从这里问什么", "Write what you want to ask first")); return; }
  const bud = S.bud != null ? (n.buds || [])[S.bud]?.idea : null;
  S.sending = true; S.draft = text; renderCont(n, S.bud != null);
  try {
    const r = await api(`/v1/thought-nodes/${n.id}/continue`, { body: { text, agent: $("#tnAgent")?.value || "auto", focus: !!$("#tnFocus")?.checked, bud, refs: S.contRefs } });
    if (r.reply?.error && !r.reply?.text) toast(r.reply.error);
    S.draft = ""; delete S.detail[r.node.id];
    await loadTree(true); S.node = r.node.id; S.bud = null; S.tab = "turns"; history.replaceState(null, "", qs());
    drawTree(true); await loadNode(r.node.id, true);
  } catch (err) { toast(err.message); }
  finally { S.sending = false; renderNode(); }
}
async function doOp(kind) {
  const n = nodeOf(S.node); if (!n) return;
  try {
    if (kind === "edit") {
      await api(`/v1/thought-nodes/${n.id}`, { method: "PATCH", body: { title: $("#fTitle").value, summary: $("#fSummary").value, key_thoughts: $("#fKeys").value.split("\n").map((x) => x.trim()).filter(Boolean) } });
      S.op = null; toast(L("已保存", "Saved")); await refresh(n.id);
    } else if (kind === "branch") {
      const title = $("#fBranch").value.trim(); if (!title) { toast(L("写一句这条分支的方向", "Write the branch's direction")); return; }
      const b = await api(`/v1/thought-nodes/${n.id}/branch`, { body: { title } }); S.op = null; await loadTree(true); select(b.id); toast(L("长出了一条空分支：在下面写点什么，它就开始长", "A new branch: write below and it starts to grow"));
    } else if (kind === "move") {
      await api(`/v1/thought-nodes/${n.id}`, { method: "PATCH", body: { parent_id: $("#fParent").value || null } }); S.op = null; toast(L("已移过去", "Moved")); await refresh(n.id);
    } else if (kind === "pick-other") {
      const v = $("#fOther").value; if (!v) { toast(L("在左边点一个节点，或从列表里选", "Click a node on the tree, or pick one")); return; }
      const [aim, id] = v.split("|"); S.exWith = id; S.exOther = ([...S.forest.trees, S.forest.you].find((t) => t && t.id === aim)?.nodes || []).find((x) => x.id === id); S.op = "exchange"; renderNode();
    } else if (kind === "exchange") {
      S.sending = true; renderNode();
      try { const r = await api(`/v1/thought-nodes/${n.id}/exchange`, { body: { with: S.exWith, text: $("#fExText")?.value || "" } });
        S.op = null; await loadTree(true); select(r.node.id); S.tab = "turns"; renderNode(); toast(L("交流完成", "Done")); }
      finally { S.sending = false; }
    }
  } catch (err) { toast(err.message); }
}
async function quickOp(op) {
  const n = nodeOf(S.node); if (!n) return;
  S.menu = false;
  try {
    if (op === "hide") { await api(`/v1/thought-nodes/${n.id}`, { method: "PATCH", body: { hidden: !n.hidden } }); toast(n.hidden ? L("显示回来了", "Shown again") : L("已隐藏（连同它长出去的）", "Hidden, with what grew from it")); await refresh(n.id); }
    else if (op === "merge") { if (!confirm(L(`把「${n.title}」并进上一级？`, `Merge “${n.title}” into its parent?`))) return; const p = await api(`/v1/thought-nodes/${n.id}/merge`, { method: "POST" }); await loadTree(true); select(p.id); toast(L("已合并", "Merged")); }
    else if (op === "delete") { if (!confirm(L(`删除「${n.title}」？对话仍留在记录里，只是不再显示在树上。`, `Delete “${n.title}”? The dialogue stays on record; it just leaves the tree.`))) return; const parent = n.parent; await api(`/v1/thought-nodes/${n.id}`, { method: "DELETE" }); await loadTree(true); select(parent); toast(L("已删除", "Deleted")); }
    else if (op === "markdown") { window.open(`/v1/thought-nodes/${n.id}/markdown`, "_blank"); renderNode(); }
    else if (op === "distill") {
      toast(L("正在沉淀这段思路…", "Distilling this line of thought…")); const r = await api(`/v1/thought-nodes/${n.id}/distill`, { method: "POST" });
      toast(r.status === "compiled" ? L(`已沉淀成一份数据集（${r.words} 词）`, `Distilled into a dataset (${r.words} words)`) : r.status === "deferred" ? L("现在额度不够，稍后再试", "No budget right now; try later") : `${r.note || r.status}`);
      S.tab = "knowledge"; await refresh(n.id);
    }
  } catch (err) { toast(err.message); }
}

    <div class="label">${L("受控分叉 · 多次生成", "Controlled forking · samples")}</div>
    <div style="font-size:13px;margin:8px 0">${L("每个问题最多生成", "At most")} <input type="number" id="setSamples" min="1" max="5" value="${t.samples ?? 3}" style="width:60px"> ${L("次。实际次数由 P(fork)=f(不确定性, 分歧, 影响, 成本) 决定；分出明显不同的结论会留作影子路线，回顾时重新考虑。", "samples per question. How many is decided by P(fork) = f(uncertainty, disagreement, impact, cost); clearly different conclusions are kept as shadow paths and revisited.")}</div>
    <div style="font-size:13px;margin-bottom:16px">${L("提示词扰动强度", "Prompt perturbation")} <input type="range" id="setPerturb" min="0" max="1" step="0.1" value="${t.perturb ?? .5}" style="vertical-align:middle"> <span id="pv" class="num">${(t.perturb ?? .5).toFixed(1)}</span></div>
    <div class="label">${L("多 agent 分配", "How work is shared among agents")}</div><div style="display:flex;gap:6px;margin:8px 0 18px">${Object.entries(PRESETS).map(([k, [nm]]) => `<label class="chip ${k === preset ? "on" : ""}"><input type="radio" name="preset" value="${k}" ${k === preset ? "checked" : ""} style="display:none">${nm}</label>`).join("")}</div>
    <div class="form" style="border:0;background:none;padding:0"><div class="row"><button class="ghost" data-closemodal="1">${L("取消", "Cancel")}</button><button class="primary" id="saveSettings">${L("保存", "Save")}</button></div></div>`);
  document.querySelectorAll('input[name=preset]').forEach((r) => r.addEventListener("change", () => document.querySelectorAll('input[name=preset]').forEach((x) => x.parentElement.classList.toggle("on", x.checked))));
  $("#setPerturb").addEventListener("input", (e) => { $("#pv").textContent = Number(e.target.value).toFixed(1); });
}
async function saveSettings() {
  const lvl = document.querySelector('input[name=lvl]:checked')?.value, preset = document.querySelector('input[name=preset]:checked')?.value;
  const settings = { autonomy: lvl, checkpoint_every: Number($("#setEvery").value), samples: Number($("#setSamples").value), perturb: Number($("#setPerturb").value) };
  if (preset) settings.alloc = { preset, ...PRESETS[preset][1] };
  try { await api(`/v1/aims/${S.aim}/perpetual`, { method: "PATCH", body: { settings } }); document.querySelector(".modal")?.remove(); toast(L("已保存", "Saved")); await loadTree(true); }
  catch (err) { toast(err.message); }
}
async function showDoc(id) {
  const d = await api(`/v1/bodies/${id}/document${EN ? "?lang=en" : ""}`).catch((e) => ({ error: e.message }));
  modal(d.error ? esc(d.error) : `<h2>${esc(d.title)}</h2><div class="muted" style="margin-bottom:12px">${esc(d.gist || "")}</div>${d.summary ? PGATree.summary(d.summary) : ""}<div class="md" style="margin-top:16px">${md(d.full || L("（还没有全文）", "(no full text yet)"))}</div>`);
}
document.addEventListener("click", async (e) => {
  if (S.menu && !e.target.closest(".menu")) { S.menu = false; renderNode(); }
  const t = e.target.closest("[data-tnode], [data-tbud], [data-go], [data-goaim], [data-tab], [data-filter], [data-bud], [data-focus], [data-op], [data-do], [data-trnode], [data-doc], [data-ref], [data-unref], [data-mode], [data-refadd], [data-unrefnode], [data-move], [data-crefdel], [data-answer], [data-drop], [data-cp], [data-closemodal], [data-lang], #send, #curate, #rewrite, #runBtn, #waitBtn, #setBtn, #saveSettings");
  if (!t) return;
  if (t.tagName === "A" || t.dataset.tab || t.dataset.go || t.dataset.goaim) e.preventDefault();
  if (t.dataset.lang) { store.set("pga_lang", t.dataset.lang); const q = new URLSearchParams(location.search); q.delete("lang"); location.search = q.toString(); return; }
  if (t.dataset.mode) { S.mode = t.dataset.mode; store.set("pga_tree_mode", S.mode); renderBar(); drawTree(false); return; }
  if (t.dataset.crefdel) { e.preventDefault(); S.contRefs = S.contRefs.filter((x) => x !== t.dataset.crefdel); renderCont(nodeOf(S.node), S.bud != null); return; }
  if (t.dataset.tbud) { const [id, i] = t.dataset.tbud.split("|"); S.tab = "overview"; select(id, Number(i)); return; }
  if (t.dataset.tnode) { select(t.dataset.tnode); return; }
  if (t.dataset.go) { select(t.dataset.go); return; }
  if (t.dataset.goaim) { const q = t.dataset.goaim === "you" ? "you=1" : `aim=${t.dataset.goaim}`; if (t.dataset.goaim === S.aim) { select(t.dataset.gonode); return; } location.href = `/tree?${q}&node=${t.dataset.gonode}${AS_UID ? `&as=${AS_UID}` : ""}`; return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; store.set("pga_tree_tab2", S.tab); renderNode(); if (S.tab === "turns") scrollToSeam(); return; }
  if (t.dataset.trnode) { translateTurns(t.dataset.trnode); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; renderBody(); return; }
  if (t.dataset.bud !== undefined) { S.bud = Number(t.dataset.bud); drawTree(false); renderNode(); $("#tnText")?.focus(); return; }
  if (t.dataset.refadd || t.dataset.unrefnode) {
    const n = nodeOf(S.node), add = $("#refAdd")?.value;
    const refs = t.dataset.unrefnode ? (n.refs || []).filter((x) => x !== t.dataset.unrefnode) : add ? [...(n.refs || []), add] : null;
    if (!refs) { toast(L("选一份知识", "Pick one")); return; }
    try { await api(`/v1/thought-nodes/${n.id}/refs`, { method: "PUT", body: { refs } }); toast(t.dataset.unrefnode ? L("不再参考", "Removed") : L("从这里继续时，agent 会读到它", "Agents will read it when continuing from here")); await refresh(n.id); } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.move) { const to = $("#moveTo")?.value; if (!to) { toast(L("选一个节点", "Pick a node")); return; }
    try { await api(`/v1/bodies/${t.dataset.move}/move`, { body: { node_id: to } }); toast(L("已移过去", "Moved")); await refresh(S.node); } catch (err) { toast(err.message); } return; }
  if (t.dataset.op !== undefined) {
    const op = t.dataset.op;
    if (op === "menu") { S.menu = !S.menu; renderNode(); return; }
    if (["hide", "merge", "delete", "distill", "markdown"].includes(op)) { quickOp(op); return; }
    S.op = op || null; S.menu = false; renderNode();
    if (op === "exchange-pick") {
      const f = await forest().catch(() => null), sel = $("#fOther");
      if (f && sel) sel.innerHTML = `<option value="">${L("（别的树的节点）", "(a node in another tree)")}</option>` + [...f.trees, ...(f.you ? [f.you] : [])].filter((x) => x.id !== S.aim && x.nodes.length)
        .map((x) => `<optgroup label="${esc(x.text.slice(0, 30))}">${x.nodes.map((m) => `<option value="${x.id}|${m.id}">${esc(m.title)}</option>`).join("")}</optgroup>`).join("");
    }
    if (op === "branch") $("#fBranch")?.focus();
    return;
  }
  if (t.dataset.do) { doOp(t.dataset.do); return; }
  if (t.dataset.doc) { showDoc(t.dataset.doc); return; }
  if (t.dataset.ref) { const to = $("#refTo")?.value; if (!to) { toast(L("选一棵树", "Pick a tree")); return; } try { await api(`/v1/aims/${to}/references`, { body: { body_id: t.dataset.ref } }); toast(L("那棵树之后每一轮都会读到它", "That tree will read it every round")); S.forest = null; renderNode(); } catch (err) { toast(err.message); } return; }
  if (t.dataset.unref) { try { await api(`/v1/aims/${S.aim}/references/${t.dataset.unref}`, { method: "DELETE" }); toast(L("不再参考", "Removed")); await refresh(); } catch (err) { toast(err.message); } return; }
  if (t.dataset.focus !== undefined) {
    try { await api(`/v1/aims/${S.aim}/tree/focus`, { body: { node_id: t.dataset.focus || null } }); toast(t.dataset.focus ? L("之后 PGA 会沿这条分支想", "PGA will follow this branch") : L("已取消", "Stopped")); await loadTree(true); drawTree(false); renderNode(); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.id === "send") { send(); return; }
  if (t.id === "waitBtn") { showWaiting(); return; }
  if (t.id === "setBtn") { showSettings(); return; }
  if (t.id === "saveSettings") { saveSettings(); return; }
  if (t.dataset.closemodal) { document.querySelector(".modal")?.remove(); return; }
  if (t.dataset.answer || t.dataset.drop) {
    const id = t.dataset.answer || t.dataset.drop, text = t.dataset.answer ? (document.querySelector(`textarea[data-q="${CSS.escape(id)}"]`)?.value || "").trim() : "";
    if (t.dataset.answer && !text) { toast(L("先写下你的回答", "Write your answer first")); return; }
    try { await api(`/v1/aims/${S.aim}/perpetual/answer`, { body: t.dataset.answer ? { note_id: id, text } : { note_id: id, drop: true } });
      toast(t.dataset.answer ? L("已回答：之后的每一轮都会读到", "Answered: every later round reads it") : L("已放下这个问题", "Skipped")); await loadTree(true);
      if ((S.proc?.for_you || []).length || S.proc?.checkpoint) showWaiting(); else document.querySelector(".modal")?.remove(); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.cp) {
    const cp = S.proc?.checkpoint; if (!cp) return;
    const text = ($("#cpText")?.value || "").trim();
    if (t.dataset.cp === "adjust" && !text) { toast(L("先写下你的意见", "Write your view first")); $("#cpText")?.focus(); return; }
    if (t.dataset.cp === "stop" && !confirm(L("停下：这个抱负会暂停，直到你按开始。", "Stop: this motivation pauses until you press Start."))) return;
    const approve = [...document.querySelectorAll("[data-cpp]")].filter((x) => x.checked).map((x) => x.dataset.cpp);
    const option = Number(document.querySelector('input[name=cpopt]:checked')?.value ?? 0);
    try { await api(`/v1/aims/${S.aim}/perpetual/checkpoint`, { body: { note_id: cp.id, decision: t.dataset.cp, text, option, approve } });
      toast({ continue: L("已同意，继续", "Continuing"), adjust: L("已按你的意见调整", "Adjusted"), stop: L("已停下", "Stopped") }[t.dataset.cp]); document.querySelector(".modal")?.remove(); await loadTree(true); }
    catch (err) { toast(err.message); }
    return;
  }
  if (t.id === "curate") { try { const r = await api(YOU() ? `/v1/users/${S.uid}/tree/curate` : `/v1/aims/${S.aim}/tree/curate`, { method: "POST", body: {} }); toast(L(`开始整理 ${r.pending} 轮对话`, `Placing ${r.pending} turns`)); } catch (err) { toast(err.message); } return; }
  if (t.id === "rewrite") { try { await api(YOU() ? `/v1/users/${S.uid}/tree/rewrite` : `/v1/aims/${S.aim}/tree/rewrite`, { method: "POST" }); toast(L("整理者在后台重写这些概括", "The curator is rewriting them in the background")); } catch (err) { toast(err.message); } return; }
  if (t.id === "runBtn") {
    const T = S.tree, on = T.task?.status === "running"; if (!T.project) return;
    try { await api(`/v1/users/${S.uid}/projects/${T.project.id}/run`, { body: { action: on ? "pause" : "start" } }); toast(on ? L("已暂停", "Paused") : L("开始了", "Started")); await loadTree(true); }
    catch (err) { toast(err.message); }
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "search") { S.search = e.target.value; const pos = e.target.selectionStart; renderBody(); const s = $("#search"); s.focus(); s.setSelectionRange(pos, pos); } });
document.addEventListener("change", (e) => {
  if (e.target.id === "crefAdd" && e.target.value) { S.contRefs = [...S.contRefs, e.target.value]; renderCont(nodeOf(S.node), S.bud != null); return; }
  if (e.target.id === "aimPick") { S.aim = e.target.value; S.node = null; S.bud = null; S.detail = {}; S.beh = {}; S.seen = new Set(); history.replaceState(null, "", qs()); loadTree(); }
  if (e.target.id === "showHidden") { S.showHidden = e.target.checked; drawTree(false); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "tnText" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); return; }
  if (e.key === "Escape") { document.querySelector(".modal")?.remove(); if (S.op || S.menu) { S.op = null; S.menu = false; renderNode(); } return; }
  if (e.target.closest?.("textarea, input, select")) return;
  const list = S.layout?.list || [], i = list.findIndex((x) => x.id === S.node);
  if (e.key === "ArrowUp" && i < list.length - 1) { e.preventDefault(); select(list[i + 1].id); }
  if (e.key === "ArrowDown" && i > 0) { e.preventDefault(); select(list[i - 1].id); }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S.tree && drawTree(false), 150); });
boot();
</script>
