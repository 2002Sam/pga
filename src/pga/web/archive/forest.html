<style>
:root {
  --bg: #09090b; --panel: #0f0f12; --raised: #16161a; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12); --line-3: rgba(255,255,255,.2);
  --text: #ececef; --muted: #a1a1aa; --dim: #71717a; --accent: #d6a75c; --accent-soft: rgba(214,167,92,.12); --blue: #8fb4ff; --green: #7fcf9f;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -.003em; }
a { color: inherit; text-decoration: none; } button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
button:hover { border-color: var(--line-3); background: var(--hover); } button.primary { background: var(--text); color: var(--onprimary); border-color: transparent; } button.primary:hover { background: var(--text); opacity: .88; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); } button.ghost:hover { color: var(--text); background: rgba(255,255,255,.04); }
.label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 20px; height: 52px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--hdr); backdrop-filter: blur(12px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .02em; } .brand img { width: 18px; height: 18px; opacity: .9; }
nav { display: flex; gap: 2px; } nav a { padding: 5px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; } nav a.on { color: var(--text); background: rgba(255,255,255,.06); } nav a:hover { color: var(--text); }
.hright { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3f3f46; margin-right: 6px; vertical-align: 1px; } .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(127,207,159,.15); }
.lang { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; } .lang button { height: 26px; border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 0 9px; font-size: 12px; }
.lang button.on { background: rgba(255,255,255,.08); color: var(--text); }
main { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }
.intro { margin-bottom: 26px; } .intro h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; } .intro p { margin: 6px 0 0; color: var(--muted); max-width: 680px; }
.models { display: grid; grid-template-columns: 1fr 1.35fr; gap: 16px; margin-bottom: 36px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.card.click { cursor: pointer; transition: border-color .2s, background .2s; } .card.click:hover { border-color: var(--line-2); background: var(--hover); }
.mh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; } .mh .t { font-size: 15px; font-weight: 600; } .mh .s { font-size: 12px; color: var(--dim); }
.world .g { font-size: 14.5px; line-height: 1.6; } .world .b { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.dims { display: grid; } .dim { display: grid; grid-template-columns: 120px 1fr 56px; gap: 14px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.dim:first-child { border-top: 0; padding-top: 2px; } .dim .k { font-size: 13px; font-weight: 500; } .dim .v { font-size: 13px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dim:hover .v { color: var(--text); }
.conf { height: 3px; background: rgba(255,255,255,.07); border-radius: 2px; align-self: center; } .conf i { display: block; height: 100%; border-radius: 2px; background: var(--text); opacity: .65; }
.sect { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 14px; gap: 16px; } .sect h2 { margin: 0; font-size: 15px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; }
.tree { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: border-color .2s, transform .25s ease, opacity .35s; }
.tree:hover { border-color: var(--line-2); transform: translateY(-2px); }
.stage { position: relative; height: 230px; background: radial-gradient(ellipse at 50% 100%, rgba(214,167,92,.07), transparent 65%), linear-gradient(var(--inset), var(--panel)); border-bottom: 1px solid var(--line); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tree .info { padding: 14px 16px 16px; } .tree .name { font-size: 14px; font-weight: 600; line-height: 1.45; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tree .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--dim); }
.tree .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 30px; } .tree .row .grow { flex: 1; font-size: 12px; color: var(--muted); }
.pbar { width: 64px; height: 3px; background: rgba(255,255,255,.07); border-radius: 2px; } .pbar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.badge { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 600; color: var(--onprimary); background: var(--accent); border-radius: 999px; padding: 1px 8px; z-index: 1; }
.tag { position: absolute; top: 12px; left: 14px; font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--green); z-index: 1; }
.tree.paused .stage svg { opacity: .55; filter: grayscale(.4); }
.mini .br { fill: none; stroke: rgba(var(--ti),.42); stroke-linecap: round; } .mini .br.mine { stroke: rgba(127,207,159,.7); } .mini .br.ex { stroke: rgba(143,180,255,.6); }
.mini .dt { fill: var(--tbg); stroke: rgba(var(--ti),.85); stroke-width: 1; } .mini .dt.tip { fill: var(--accent); stroke: var(--accent); }
.mini .root { fill: none; stroke: rgba(214,167,92,.25); stroke-width: 1; } .mini .seed { fill: var(--tbg); stroke: var(--accent); stroke-width: 1.2; }
.mini .twig { fill: none; stroke: rgba(var(--ti),.25); stroke-width: .7; }
.mini .sap { fill: none; stroke: rgba(240,210,160,.85); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: .05 .95; stroke-dashoffset: 1; animation: sap 3.4s linear infinite; }
@keyframes sap { to { stroke-dashoffset: 0; } }
.tree.you .mini .br { stroke: rgba(127,207,159,.55); } .tree.you .mini .dt { stroke: rgba(150,220,178,.95); }
.plant { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 340px; border: 1px dashed var(--line-2); border-radius: 14px; color: var(--muted); cursor: pointer; padding: 20px; transition: border-color .2s, color .2s; }
.plant:hover { border-color: var(--line-3); color: var(--text); } .plant .plus { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-3); display: grid; place-items: center; font-size: 18px; margin-bottom: 12px; }
.plant textarea { width: 100%; min-height: 110px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; outline: none; resize: vertical; }
.plant textarea:focus { border-color: var(--line-3); }
.lib { margin-top: 40px; } .rows { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
.lr { display: grid; grid-template-columns: 110px minmax(0, 1.2fr) minmax(0, 2fr) 200px; gap: 16px; align-items: baseline; padding: 12px 18px; border-top: 1px solid var(--line); cursor: pointer; }
.lr:first-child { border-top: 0; } .lr:hover { background: rgba(255,255,255,.02); }
.lr .ty { font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); } .lr .ti { font-weight: 500; font-size: 13.5px; }
.lr .gi { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .lr .us { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 26px 18px; color: var(--dim); font-size: 13px; }
footer { text-align: center; padding: 26px 0 40px; font-size: 12px; } footer a { color: var(--dim); } footer a:hover { color: var(--muted); }
#guide { position: fixed; left: 0; top: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; pointer-events: none; z-index: 20; background: #f5e3c2;
  box-shadow: 0 0 10px 3px rgba(214,167,92,.35); transition: width .25s, height .25s, margin .25s; opacity: .85; }
#guide.on { width: 12px; height: 12px; margin: -6px 0 0 -6px; box-shadow: 0 0 16px 5px rgba(214,167,92,.42); }
body.entering .tree:not(.going), body.entering .models, body.entering .lib, body.entering .intro, body.entering .plant, body.entering .sect { opacity: 0; transition: opacity .45s; }
.flyer { position: fixed; z-index: 30; pointer-events: none; transition: all .8s cubic-bezier(.65,0,.35,1); }
#veil { position: fixed; inset: 0; z-index: 29; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .5s .45s; } body.entering #veil { opacity: 1; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 40; }
.modal .box { width: min(820px, 92vw); max-height: 86vh; overflow: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; padding: 24px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.modal h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; } .md p { margin: .5em 0; line-height: 1.75; } .md h1, .md h2, .md h3 { font-weight: 600; letter-spacing: -.01em; }
.dd { border-top: 1px solid var(--line); padding: 14px 0; } .dd:first-of-type { border-top: 0; } .dd .hh { display: flex; justify-content: space-between; align-items: baseline; }
.dd .hh b { font-weight: 600; } .dd ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; } .dd .sm { margin: 4px 0; font-size: 13.5px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--pop); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 14px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50; }
#toast.on { opacity: 1; }
@media (max-width: 860px) { .models { grid-template-columns: 1fr; } .lr { grid-template-columns: 90px 1fr; } .lr .gi, .lr .us { display: none; } }
@media (pointer: coarse) { #guide { display: none; } }

:root { --hdr: rgba(9,9,11,.85); --canvas: #0a0a0c; --inset: #0c0c0f; --pop: #17171b; --hover: #1c1c21; --onprimary: #0b0b0e; }
[data-theme=light] { --bg: #f6f6f7; --panel: #ffffff; --raised: #f1f1f3; --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.13); --line-3: rgba(0,0,0,.24);
  --text: #18181b; --muted: #52525b; --dim: #8a8a93; --accent: #a8741f; --accent-soft: rgba(168,116,31,.10); --blue: #2563c9; --green: #1f8a4c; --bad: #c2412d;
  --hdr: rgba(255,255,255,.88); --canvas: #fbfbfc; --inset: #f4f4f6; --pop: #ffffff; --hover: #ebebee; --onprimary: #ffffff; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/" id="home"><img src="/icons/logo-128.png?v=witch-cat-1" alt="PGA 魔女猫">PGA</a>
  <nav><a class="on" href="#" data-l="森林|Forest">森林</a></nav>
  <div class="hright"><span id="pulse"></span><a href="/agents" id="toAgents" style="color:var(--muted)">Agents</a><span id="shell"></span></div>
</header>
<main>
  <div class="intro"><h1 data-l="森林|Forest">森林</h1><p data-l="每个长期抱负是一棵思考树，你自己的对话是另一棵。它们共用两个模型：世界正在发生什么，以及你是谁。|Every long-range motivation grows a tree of thought; your own conversations grow another. They share two models: what is happening in the world, and who you are.">…</p></div>
  <section class="models"><div class="card click world" id="world"></div><div class="card" id="personal"></div></section>
  <div class="sect"><h2 data-l="树|Trees">树</h2><span class="label" id="treeCount"></span></div>
  <section class="grid" id="forest"><div class="empty">…</div></section>
  <section class="lib"><div class="sect"><h2 data-l="知识库|Library">知识库</h2><span class="label" data-l="树沉淀出的知识，可以给别的树参考|Knowledge distilled by the trees, for other trees to use">…</span></div><div class="rows" id="shelf"></div></section>
</main>
<footer><a id="toArchive" href="/archive/console" data-l="旧的工作台和星空（存档）|The old workbench and sky (archive)">…</a></footer>
<div id="veil"></div><div id="guide"></div><div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = PGATree.esc;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const Q = new URLSearchParams(location.search), AS_UID = Q.get("as");
const LANG = Q.get("lang") || store.get("pga_lang") || "zh";
PGATree.setLang(LANG); document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
const L = (zh, en) => (LANG === "en" ? en : zh);
const asq = AS_UID ? `as=${encodeURIComponent(AS_UID)}` : "";
const F = { uid: AS_UID || store.get("pga_uid"), data: null, live: [] };
const md = (t) => (window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t || ""))) : esc(t));
const ago = (iso) => { if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? L("刚刚", "just now") : s < 3600 ? L(`${Math.floor(s / 60)} 分钟前`, `${Math.floor(s / 60)}m ago`) : s < 86400 ? L(`${Math.floor(s / 3600)} 小时前`, `${Math.floor(s / 3600)}h ago`) : L(`${Math.floor(s / 86400)} 天前`, `${Math.floor(s / 86400)}d ago`); };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3200); }
async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || (opts.body ? "POST" : "GET"), headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error((data && (data.detail?.toString?.() || data.error)) || res.statusText);
  return data;
}
document.querySelectorAll("[data-l]").forEach((el) => { const [zh, en] = el.dataset.l.split("|"); el.textContent = L(zh, en); });
PGAShell.mount($("#shell")); $("#toAgents").href = "/agents" + (AS_UID ? `?${asq}` : "");
document.title = L("森林 · PGA", "Forest · PGA");

/* one tree, small: its real shape (the same layout as the tree page), no labels */
function miniTree(t) {
  const W = 300, H = 230, nodes = (t.nodes || []).filter((n) => !n.hidden && n.kind !== "bud"), uid = String(t.id).slice(0, 6);
  if (!nodes.length) return `<svg viewBox="0 0 ${W} ${H}" class="mini"><path class="root" d="M ${W / 2} ${H - 30} c -10 9 -22 12 -36 14 M ${W / 2} ${H - 30} c 10 9 22 12 36 14"/>
    <path class="br" d="M ${W / 2} ${H - 30} C ${W / 2 - 3} ${H - 56}, ${W / 2 + 5} ${H - 74}, ${W / 2} ${H - 88}" style="stroke-width:2"/><circle class="seed" cx="${W / 2}" cy="${H - 30}" r="5"/></svg>`;
  const row = Math.max(3, Math.min(15, (H - 64) / (nodes.length + 1)));
  const T = PGATree.layout({ nodes }, W * 1.6, row, 0);
  const minX = Math.min(...T.list.map((n) => n.x), T.cx), maxX = Math.max(...T.list.map((n) => n.x), T.cx);
  const sx = Math.min(1, (W - 60) / Math.max(1, maxX - minX)), ox = W / 2 - T.cx * sx, oy = H - 30 - T.y0;
  const X = (x) => ox + x * sx, Y = (y) => oy + y;
  const tipPath = new Set(); for (let x = T.list.find((n) => n.tip) || T.list[T.list.length - 1]; x; x = x.p === "root" ? null : T.by.get(x.p)) tipPath.add(x.id);
  let edges = "", dots = "", sap = "", k = 0;
  for (const n of T.list) {
    const p = n.p === "root" ? { x: T.cx, y: T.y0 } : T.by.get(n.p), w = Math.max(.7, 3.6 - n.depth * .26);
    const d = `M ${X(p.x)} ${Y(p.y)} C ${X(p.x)} ${Y(p.y) - (p.y - n.y) * .45}, ${X(n.x)} ${Y(n.y) + (p.y - n.y) * .45}, ${X(n.x)} ${Y(n.y)}`;
    edges += `<path class="br ${n.kind === "user" ? "mine" : n.kind === "exchange" ? "ex" : ""}" d="${d}" style="stroke-width:${w.toFixed(2)}"/>`;
    if (tipPath.has(n.id)) sap += `<path class="sap" d="${d}" pathLength="1" style="animation-delay:${(k++ * .3).toFixed(2)}s"/>`;
    if (n.sampled) for (let j = 0; j < 3; j++) { const a = -Math.PI / 2 + (j - 1) * .55; edges += `<path class="twig" d="M ${X(n.x)} ${Y(n.y)} l ${Math.cos(a) * 7} ${Math.sin(a) * 7}"/>`; }
    dots += `<circle class="dt ${n.tip ? "tip" : ""}" cx="${X(n.x).toFixed(1)}" cy="${Y(n.y).toFixed(1)}" r="${Math.max(1.5, Math.min(3.8, 1.3 + Math.sqrt(n.turns || 1) * .32)).toFixed(1)}"/>`;
  }
  const rx = X(T.cx), ry = Y(T.y0);
  let roots = ""; for (let i = 0; i < 6; i++) { const a = -1 + i / 2.5; roots += `<path class="root" d="M ${rx} ${ry} C ${rx + a * 9} ${ry + 9}, ${rx + a * 22} ${ry + 12}, ${rx + a * 34} ${ry + 16}"/>`; }
  const glow = Math.min(1, .2 + (t.task?.pressure || (t.scope === "user" ? .3 : 0)) * .8);
  return `<svg viewBox="0 0 ${W} ${H}" class="mini" preserveAspectRatio="xMidYMax meet"><defs><radialGradient id="g${uid}"><stop offset="0" stop-color="#d6a75c" stop-opacity="${(glow * .22).toFixed(2)}"/><stop offset="1" stop-color="#d6a75c" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="${rx}" cy="${ry - (H - 50) * .45}" rx="${W * .45}" ry="${H * .5}" fill="url(#g${uid})"/>
    ${roots}${edges}${t.task?.status === "running" || t.scope === "user" ? sap : ""}${dots}<circle class="seed" cx="${rx}" cy="${ry}" r="4.5"/></svg>`;
}
const DIMS = [["background", "背景", "Background"], ["goals", "目标", "Goals"], ["preferences", "偏好", "Preferences"], ["abilities", "能力", "Knowledge & skills"], ["state", "状态", "Current state"]];
function render() {
  const D = F.data, K = D.knowledge || [], world = K.find((k) => k.system === "world"), user = K.find((k) => k.system === "user"), P = D.personal;
  $("#world").dataset.doc = world?.id || "";
  $("#world").innerHTML = world ? `<div class="mh"><span class="t">${L("世界模型", "World model")}</span><span class="s">${world.compiled_at ? ago(world.compiled_at) : L("还没有整理", "not compiled yet")}</span></div>
      <div class="g">${esc(world.gist || "")}</div>${world.brief ? `<div class="b">${esc(world.brief)}</div>` : ""}
      <div class="label" style="margin-top:12px">${L("热榜汇总 · 每一棵树每一轮都会读到", "Hot lists, summarised · read by every tree, every round")}</div>` : "";
  $("#personal").innerHTML = `<div class="mh"><span class="t">${L("个人模型", "Personal model")}</span><span class="s">${user?.compiled_at ? ago(user.compiled_at) : ""}${user ? ` · <a href="#" data-doc="${user.id}" style="color:var(--muted)">${L("全文", "Full text")}</a>` : ""}</span></div>
    ${P ? `<div class="dims">${DIMS.map(([k, zh, en]) => { const x = P[k] || {}; return `<div class="dim" data-dim="${k}"><span class="k">${L(zh, en)}</span><span class="v">${esc(x.summary || L("还看不出来", "Not enough to tell yet"))}</span><span class="conf" title="${L("把握", "confidence")} ${Math.round((x.confidence || 0) * 100)}%"><i style="width:${Math.round((x.confidence || 0) * 100)}%"></i></span></div>`; }).join("")}</div>`
      : `<div class="empty" style="padding:8px 0">${L("还没有按五个维度整理过：背景、目标、偏好、能力、状态。", "Not compiled into its five dimensions yet: background, goals, preferences, knowledge & skills, current state.")} ${user ? `<a href="#" data-compile="${user.id}" style="color:var(--accent)">${L("现在整理", "Compile now")}</a>` : ""}</div>`}`;
  const running = D.trees.filter((t) => t.task?.status === "running").length, working = (F.live || []).filter((r) => r.running).length;
  $("#pulse").innerHTML = `<span><span class="dot ${working ? "on" : ""}"></span>${working ? L(`${working} 个 agent 在工作`, `${working} agents working`) : L("没有 agent 在工作", "No agent working")}</span>`;
  $("#treeCount").textContent = L(`${running} / ${D.trees.length} 棵在生长`, `${running} of ${D.trees.length} growing`);
  const card = (t, you) => {
    const nodes = (t.nodes || []).filter((n) => n.kind !== "bud"), on = t.task?.status === "running";
    return `<div class="tree ${you ? "you" : ""} ${!you && !on ? "paused" : ""}" data-tree="${you ? "you" : t.id}">${you ? `<span class="tag">${L("你的对话", "Your conversations")}</span>` : ""}${t.for_you ? `<span class="badge" title="${L("只有你能回答的问题", "Questions only you can answer")}">${t.for_you}</span>` : ""}
      <div class="stage">${miniTree(you ? { ...t, scope: "user" } : t)}</div>
      <div class="info"><div class="name">${esc(you ? L("你在 PGA 里的对话，和从其他应用导入的对话", "Your chats in PGA and the ones imported from other apps") : t.text)}</div>
        <div class="meta num"><span>${L(`${nodes.length} 个节点`, `${nodes.length} nodes`)}</span>${t.last_growth ? `<span>${L("最近生长 ", "grew ")}${ago(t.last_growth)}</span>` : ""}${t.pending ? `<span>${L(`${t.pending} 轮待整理`, `${t.pending} turns to place`)}</span>` : ""}</div>
        <div class="row"><span class="grow">${you ? "" : t.task ? `<span class="dot ${on ? "on" : ""}"></span>${on ? L("生长中", "Growing") : L("已暂停", "Paused")}` : L("还没有开始", "Not started")}</span>
          ${!you && t.task ? `<span class="pbar" title="${L("张力", "Pressure")} ${t.task.pressure.toFixed(2)}"><i style="width:${Math.round(t.task.pressure * 100)}%"></i></span>` : ""}
          ${!you && t.project ? `<button data-run="${t.id}">${on ? L("暂停", "Pause") : L("开始", "Start")}</button>` : ""}
          ${you && t.pending && !nodes.length ? `<button data-growyou="1">${L("长出这棵树", "Grow it")}</button>` : ""}</div></div></div>`;
  };
  $("#forest").innerHTML = (D.you ? card(D.you, true) : "") + D.trees.map((t) => card(t, false)).join("")
    + `<div class="plant" id="seed">${F.planting ? `<textarea id="seedText" placeholder="${L("一个长期的抱负：你想让 PGA 一直朝什么方向努力？", "A long-range motivation: what should PGA keep working towards?")}"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="ghost" id="seedCancel">${L("取消", "Cancel")}</button><button class="primary" id="seedGo">${L("种下", "Plant")}</button></div>`
      : `<div class="plus">+</div><div style="font-weight:500">${L("新的抱负", "New motivation")}</div><div style="font-size:12.5px;margin-top:4px;color:var(--dim)">${L("种下一棵新的树", "Plant a new tree")}</div>`}</div>`;
  const names = new Map(D.trees.map((t) => [t.id, t.text]));
  const TY = { aim: ["抱负知识", "Motivation"], branch: ["思路", "Line of thought"] };
  const rows = K.filter((k) => !["user", "world"].includes(k.system));
  $("#shelf").innerHTML = rows.map((k) => `<div class="lr" data-doc="${k.id}"><span class="ty">${TY[k.system] ? L(...TY[k.system]) : k.kind === "skill" ? L("技能", "Skill") : L("数据集", "Dataset")}</span>
      <span class="ti">${esc(k.title)}</span><span class="gi">${esc(k.gist || "")}</span><span class="us">${(k.used_by || []).length ? L("被参考：", "Used by: ") + k.used_by.map((id) => esc((names.get(id) || "").slice(0, 18))).join(", ") : k.aim_id ? esc((names.get(k.aim_id) || "").slice(0, 24)) : ""}</span></div>`).join("")
    || `<div class="empty">${L("还没有。进入一棵树，选一段思路，点「沉淀为知识」。", "Nothing yet. Open a tree, pick a line of thought and distill it.")}</div>`;
}
async function load() {
  if (!F.uid) { try { F.uid = (await api("/healthz")).owner; } catch {} }
  F.data = await api(`/v1/users/${F.uid}/forest${LANG === "en" ? "?lang=en" : ""}`);
  try { F.live = await api(`/v1/agents/live`); } catch { F.live = []; }
  if (!document.activeElement?.matches?.("#seedText")) render();
}

/* the guide: a small light that follows you; over a tree it settles on its growing tip; click and it takes you in */
const G = { x: innerWidth / 2, y: 200, tx: innerWidth / 2, ty: 200, el: $("#guide"), lock: null };
addEventListener("mousemove", (e) => { if (!G.lock) { G.tx = e.clientX; G.ty = e.clientY; } });
(function fly() { G.x += (G.tx - G.x) * .16; G.y += (G.ty - G.y) * .16; G.el.style.transform = `translate(${G.x.toFixed(1)}px, ${G.y.toFixed(1)}px)`; requestAnimationFrame(fly); })();
function settle(t) { const tip = t.querySelector(".dt.tip") || t.querySelector(".seed"), r = tip?.getBoundingClientRect(); if (r) { G.tx = r.left + r.width / 2; G.ty = r.top + r.height / 2; } }
document.addEventListener("mouseover", (e) => {
  const t = e.target.closest?.(".tree");
  if (t && !G.going) { G.lock = t; settle(t); G.el.classList.add("on"); }
  else if (!t && G.lock && !G.going) { G.lock = null; G.el.classList.remove("on"); }
});
addEventListener("scroll", () => { if (G.lock && !G.going) settle(G.lock); }, { passive: true });
function enter(id) {
  const card = document.querySelector(`.tree[data-tree="${id}"]`); if (!card || G.going) return;
  G.going = true; card.classList.add("going"); document.body.classList.add("entering");
  const svg = card.querySelector("svg"), r = svg.getBoundingClientRect(), seed = card.querySelector(".seed").getBoundingClientRect();
  G.lock = card; G.tx = seed.left + seed.width / 2; G.ty = seed.top + seed.height / 2;
  const fly = svg.cloneNode(true); fly.classList.add("flyer");
  Object.assign(fly.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  document.body.appendChild(fly);
  requestAnimationFrame(() => setTimeout(() => {
    const s = Math.min(innerWidth / r.width, innerHeight / r.height) * .9;
    Object.assign(fly.style, { left: (innerWidth - r.width * s) / 2 + "px", top: (innerHeight - r.height * s) / 2 + "px", width: r.width * s + "px", height: r.height * s + "px", opacity: "0" });
  }, 60));
  const q = [id === "you" ? "you=1" : `aim=${id}`, asq, LANG === "en" ? "lang=en" : ""].filter(Boolean).join("&");
  setTimeout(() => { location.href = `/tree?${q}`; }, 950);
}
async function showDoc(id) {
  const d = await api(`/v1/bodies/${id}/document${LANG === "en" ? "?lang=en" : ""}`).catch((e) => ({ error: e.message }));
  const m = document.createElement("div"); m.className = "modal";
  const dims = d.dims ? DIMS.map(([k, zh, en]) => { const x = d.dims[k] || {}; return `<div class="dd"><div class="hh"><b>${L(zh, en)}</b><span class="label">${L("把握", "confidence")} ${Math.round((x.confidence || 0) * 100)}%</span></div>
      <div class="sm">${esc(x.summary || "")}</div>${(x.stated || []).length ? `<div class="label" style="margin-top:8px">${L("你说过的", "Stated")}</div><ul>${x.stated.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
      ${(x.inferred || []).length ? `<div class="label" style="margin-top:8px">${L("推断的", "Inferred")}</div><ul>${x.inferred.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}</div>`; }).join("") : "";
  m.innerHTML = `<div class="box">${d.error ? esc(d.error) : `<h2>${esc(d.title)}</h2><div style="color:var(--muted);margin-bottom:14px">${esc(d.gist || "")}</div>
    ${dims || `${d.summary ? PGATree.summary(d.summary) : ""}<div class="md" style="margin-top:16px">${md(d.full || L("（还没有全文）", "(no full text yet)"))}</div>`}
    ${d.system && !d.compiled_at ? `<button class="primary" data-compile="${id}" style="margin-top:14px">${L("现在整理", "Compile now")}</button>` : ""}`}</div>`;
  m.addEventListener("click", (e) => { if (e.target === m) m.remove(); }); document.body.appendChild(m);
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-enter], [data-run], [data-doc], [data-compile], [data-growyou], [data-lang], [data-dim], #seed, #seedGo, #seedCancel, .tree");
  if (!t) return;
  if (t.dataset.lang) { store.set("pga_lang", t.dataset.lang); const q = new URLSearchParams(location.search); q.delete("lang"); location.search = q.toString(); return; }
  if (t.dataset.growyou) { e.stopPropagation(); try { const r = await api(`/v1/users/${F.uid}/tree/curate`, { method: "POST", body: {} }); toast(L(`开始整理你的 ${r.pending} 轮对话`, `Placing your ${r.pending} turns into the tree`)); } catch (err) { toast(err.message); } return; }
  if (t.dataset.run) {
    e.stopPropagation();
    const tr = F.data.trees.find((x) => x.id === t.dataset.run), on = tr.task?.status === "running";
    try { await api(`/v1/users/${F.uid}/projects/${tr.project.id}/run`, { body: { action: on ? "pause" : "start" } }); toast(on ? L("已暂停", "Paused") : L("开始生长", "Growing")); await load(); } catch (err) { toast(err.message); }
    return;
  }
  if (t.dataset.compile) { e.preventDefault(); toast(L("整理中…", "Compiling…")); try { const r = await api(`/v1/bodies/${t.dataset.compile}/compile`, { method: "POST" }); toast(r.status === "compiled" ? L("整理好了", "Done") : r.note || r.status); document.querySelector(".modal")?.remove(); await load(); } catch (err) { toast(err.message); } return; }
  if (t.dataset.dim) { const u = F.data.knowledge.find((k) => k.system === "user"); if (u) showDoc(u.id); return; }
  if (t.dataset.doc) { e.preventDefault(); showDoc(t.dataset.doc); return; }
  if (t.id === "seedCancel") { e.stopPropagation(); F.planting = false; render(); return; }
  if (t.id === "seedGo") {
    e.stopPropagation(); const text = ($("#seedText")?.value || "").trim(); if (!text) { toast(L("写下这个抱负", "Write the motivation")); return; }
    try { await api(`/v1/users/${F.uid}/aims`, { body: { text } }); F.planting = false; toast(L("种下了：进入它，选一个工作文件夹，按开始", "Planted: open it, choose a folder, press Start")); await load(); } catch (err) { toast(err.message); }
    return;
  }
  if (t.id === "seed") { if (!F.planting) { F.planting = true; render(); $("#seedText")?.focus(); } return; }
  const id = t.dataset.enter || t.dataset.tree; if (id) enter(id);
});
$("#toArchive").href = "/archive/console" + (AS_UID ? `?${asq}` : ""); $("#home").href = "/" + (AS_UID ? `?${asq}` : "");
addEventListener("pageshow", (e) => { if (e.persisted) { G.going = false; document.body.classList.remove("entering"); document.querySelectorAll(".flyer").forEach((x) => x.remove()); } });
load(); setInterval(() => load().catch(() => {}), 20000);
</script>
</body>
</html>
