[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pga"
version = "0.1.0"
description = "A self-hosted personal multi-agent workspace"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "httpx>=0.27",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/2002Sam/pga"
Issues = "https://github.com/2002Sam/pga/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pga = ["policy.yaml", "web/*.html", "web/*.css", "web/*.js", "web/icons/*", "web/archive/*.html", "web/vendor/**/*", "manager_policy.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: calls a real LLM provider (skipped unless PGA_LIVE_TESTS=1 and an API key is set)",
]
